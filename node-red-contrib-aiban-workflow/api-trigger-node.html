<script type="text/javascript">
    RED.nodes.registerType('workflow-api-trigger', {
        category: 'Aiban 引擎',
        color: '#9FCDFF',
        defaults: {
            name: { value: "API触发器" },
            triggerId: { value: "printer_complete", required: true },
            enabled: { value: true },
            groupId: { value: "" },
            sourceId: { value: "" },
            method: { value: "POST" },
            path: { value: "/aiban/api-trigger/printer_complete" },
            contentType: { value: "json" },
            sourceIdPath: { value: "body.sourceid" },
            targetStepIdPath: { value: "" },
            mappings: { value: [
                { name: "printJobId", path: "body.printJobId" },
                { name: "printerName", path: "body.printerName" },
                { name: "printTimestamp", path: "body.printTimestamp" }
            ] },
            targetStepId: { value: "printer_complete" },
            ttlSeconds: { value: 5 },
            count: { value: 1 },
            authType: { value: "none" },
            authHeader: { value: "Authorization" },
            authPrefix: { value: "Bearer " },
            responseStatus: { value: 200 },
            responseBody: { value: '{"status":"200","errmsg":""}' },
            testUrl: { value: "http://127.0.0.1:18080/aiban/api-trigger/printer_complete" },
            testBody: { value: '{"printJobId":"PRT_TEST_001","printerName":"Printer_A","printTimestamp":"2026-05-20T10:00:00.000+08:00"}' },
            _groupCameraMap: { value: {} }
        },
        credentials: {
            authToken: { type: "password" }
        },
        inputs: 1, outputs: 1, icon: "font-awesome/fa-cloud-download",
        paletteLabel: "api trigger",
        label: function() { return this.name || "API触发器"; },
        oneditprepare: function() {
            var node = this;

            function updateGroups() {
                $('#node-input-groupId').empty().append('<option value="">选择群组</option>');
                if (node._groupCameraMap) Object.keys(node._groupCameraMap).forEach(gid =>
                    $('#node-input-groupId').append($('<option>', { value: gid, text: "Group " + gid })));
                $('#node-input-groupId').val(node.groupId);
                updateSources();
            }

            function updateSources() {
                var gid = $('#node-input-groupId').val();
                $('#node-input-sourceId').empty().append('<option value="">(可选)绑定摄像头</option>');
                if (gid && node._groupCameraMap && node._groupCameraMap[gid]) {
                    node._groupCameraMap[gid].forEach(cid =>
                        $('#node-input-sourceId').append($('<option>', { value: cid, text: "Camera " + cid })));
                }
                $('#node-input-sourceId').val(node.sourceId);
            }

            $.getJSON("/aiban/global-yaml", function(data) {
                if (data && Object.keys(data.groupCameraMap || {}).length > 0) {
                    node._groupCameraMap = data.groupCameraMap;
                    updateGroups();
                }
            });
            updateGroups();
            $('#node-input-groupId').change(updateSources);

            $('#node-input-mappings-container').editableList({
                addItem: function(container, i, opt) {
                    var row = (opt && opt.name !== undefined) ? opt : { name: "", path: "" };
                    container.css({ display: 'flex', gap: '6px', alignItems: 'center' });
                    container.append('<span style="font-size:12px;">字段</span>');
                    $('<input/>', { class: "map-name", type: "text", placeholder: "如 printJobId", style: "flex:1" }).val(row.name).appendTo(container);
                    container.append('<span style="font-size:12px;">←</span>');
                    $('<input/>', { class: "map-path", type: "text", placeholder: "如 body.printJobId", style: "flex:2" }).val(row.path).appendTo(container);
                },
                removable: true
            });
            (node.mappings || []).forEach(m => $('#node-input-mappings-container').editableList('addItem', m));

            $('#node-input-authType').change(function() {
                if ($(this).val() === 'bearer') $('#auth-bearer-panel').slideDown();
                else $('#auth-bearer-panel').slideUp();
            });
            if (node.authType === 'bearer') $('#auth-bearer-panel').show();

            $('#btn-gen-token').click(function(e) {
                e.preventDefault();
                var bytes = new Uint8Array(32);
                (window.crypto || window.msCrypto).getRandomValues(bytes);
                var b64 = btoa(String.fromCharCode.apply(null, bytes))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                $('#node-input-authToken').val(b64).attr('type', 'text');
                $('#btn-toggle-token i').attr('class', 'fa fa-eye-slash');
            });
            $('#btn-toggle-token').click(function(e) {
                e.preventDefault();
                var $t = $('#node-input-authToken');
                var hidden = $t.attr('type') === 'password';
                $t.attr('type', hidden ? 'text' : 'password');
                $('#btn-toggle-token i').attr('class', hidden ? 'fa fa-eye-slash' : 'fa fa-eye');
            });

            function syncTestUrl() {
                var path = $('#node-input-path').val() || '/aiban/api-trigger/' + ($('#node-input-triggerId').val() || 'api_trigger');
                var existing = $('#node-input-testUrl').val();
                try {
                    var u = new URL(existing);
                    u.pathname = path;
                    $('#node-input-testUrl').val(u.toString());
                } catch (e) {
                    $('#node-input-testUrl').val('http://127.0.0.1:18080' + path);
                }
            }
            $('#node-input-path').on('change', syncTestUrl);
            $('#node-input-triggerId').on('change', function() {
                var path = $('#node-input-path').val();
                var tid = $('#node-input-triggerId').val();
                if (!path || /\/aiban\/api-trigger\//.test(path)) {
                    $('#node-input-path').val('/aiban/api-trigger/' + tid);
                    syncTestUrl();
                }
                var stepInput = $('#node-input-targetStepId');
                if (!stepInput.val()) stepInput.val(tid);
            });

            $('#btn-send-test').click(function(e) {
                e.preventDefault();
                var $out = $('#test-result-output');
                $out.text('发送中...');
                var requestBody;
                try {
                    requestBody = JSON.parse($('#node-input-testBody').val() || '{}');
                } catch (err) {
                    $out.text('测试 JSON 解析失败：' + err.message);
                    return;
                }
                var payload = {
                    url: $('#node-input-testUrl').val(),
                    method: $('#node-input-method').val(),
                    contentType: $('#node-input-contentType').val(),
                    requestBody: requestBody,
                    timeoutMs: 5000
                };
                if ($('#node-input-authType').val() === 'bearer') {
                    var token = $('#node-input-authToken').val();
                    if (token) {
                        payload.authToken = token;
                        payload.authHeader = $('#node-input-authHeader').val() || 'Authorization';
                        payload.authPrefix = $('#node-input-authPrefix').val();
                    }
                }
                $.ajax({
                    url: 'aiban/test-api-trigger',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(payload)
                }).done(function(data) {
                    $out.text('HTTP ' + data.statusCode + '\n' + (data.body || ''));
                }).fail(function(xhr) {
                    var msg = (xhr.responseJSON && xhr.responseJSON.error) || xhr.statusText || '请求失败';
                    $out.text('错误：' + msg);
                });
            });
        },
        oneditsave: function() {
            var node = this;
            node.mappings = [];
            $('#node-input-mappings-container').editableList('items').each(function() {
                var el = $(this);
                var name = el.find('.map-name').val();
                var pathVal = el.find('.map-path').val();
                if (name && pathVal) node.mappings.push({ name: name, path: pathVal });
            });
        }
    });
</script>

<script type="text/html" data-template-name="workflow-api-trigger">
    <div class="form-row"><label>节点名称</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label>触发器ID</label><input type="text" id="node-input-triggerId" placeholder="如 printer_complete"></div>
    <div class="form-row">
        <label>启用</label>
        <input type="checkbox" id="node-input-enabled" style="display:inline-block;width:auto;vertical-align:middle;">
    </div>
    <div class="form-row"><label>群组</label><select id="node-input-groupId" style="width:70%"></select></div>
    <div class="form-row"><label>绑定摄像头</label><select id="node-input-sourceId" style="width:70%"></select></div>
    <div style="font-size:12px;color:#666;margin-bottom:8px;">API 触发器按摄像头工作。固定一台摄像头时在此选择；多台摄像头共用同一路径时留空，并在下方填写"动态 sourceid 路径"，从请求 body 中读取摄像头编号。</div>

    <hr><h4><i class="fa fa-globe"></i> HTTP 接口</h4>
    <div class="form-row"><label>方法</label>
        <select id="node-input-method" style="width:70%">
            <option value="POST">POST</option>
            <option value="GET">GET</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
        </select>
    </div>
    <div class="form-row"><label>路径</label><input type="text" id="node-input-path" placeholder="/aiban/api-trigger/xxx"></div>
    <div class="form-row"><label>Content-Type</label>
        <select id="node-input-contentType" style="width:70%">
            <option value="json">application/json</option>
            <option value="form">application/x-www-form-urlencoded</option>
        </select>
    </div>

    <hr><h4><i class="fa fa-key"></i> 认证</h4>
    <div class="form-row"><label>类型</label>
        <select id="node-input-authType" style="width:70%">
            <option value="none">无</option>
            <option value="bearer">Bearer Token</option>
        </select>
    </div>
    <div id="auth-bearer-panel" style="display:none; padding:10px; background:#f9f9f9; border:1px dashed #ccc; border-radius:4px; margin-bottom:12px;">
        <div class="form-row"><label>Header 名</label><input type="text" id="node-input-authHeader" placeholder="Authorization"></div>
        <div class="form-row"><label>前缀</label><input type="text" id="node-input-authPrefix" placeholder="Bearer "></div>
        <div class="form-row" style="display:flex;align-items:center;gap:6px;">
            <label>Token</label>
            <input type="password" id="node-input-authToken" style="flex:1">
            <button type="button" class="red-ui-button" id="btn-gen-token" title="生成随机 Token"><i class="fa fa-refresh"></i> 生成</button>
            <button type="button" class="red-ui-button" id="btn-toggle-token" title="显示/隐藏"><i class="fa fa-eye"></i></button>
        </div>
        <div style="font-size:12px;color:#666;">导出到 JSON 时只保存 token 的 SHA256，不保存明文。点「生成」可一键创建一个安全随机 Token。</div>
    </div>

    <hr><h4><i class="fa fa-arrow-right"></i> 事件映射</h4>
    <div class="form-row"><label>目标步骤ID</label><input type="text" id="node-input-targetStepId" placeholder="对应 sequence 中某 step 的 id"></div>
    <div class="form-row"><label>有效期(秒)</label><input type="number" id="node-input-ttlSeconds" step="0.1"></div>
    <div class="form-row"><label>计数</label><input type="number" id="node-input-count"></div>
    <div class="form-row"><label>动态 sourceid 路径</label><input type="text" id="node-input-sourceIdPath" placeholder="多摄像头共用接口时必填，如 body.sourceid"></div>
    <div class="form-row"><label>动态 step_id 路径</label><input type="text" id="node-input-targetStepIdPath" placeholder="可空，如 body.targetStepId"></div>

    <div class="form-row" style="margin-bottom:0;"><label><i class="fa fa-list"></i> 字段映射</label></div>
    <div class="form-row"><ol id="node-input-mappings-container" style="min-height:120px;"></ol></div>
    <div style="font-size:12px;color:#666;margin-bottom:8px;">支持 body.xxx / headers.xxx / query.xxx 等安全路径，可在 save_db 等动作中通过 $event.字段名 引用。</div>

    <hr><h4><i class="fa fa-reply"></i> 响应</h4>
    <div class="form-row"><label>HTTP 状态</label><input type="number" id="node-input-responseStatus"></div>
    <div class="form-row"><label>响应体(JSON)</label><textarea id="node-input-responseBody" rows="3" style="width:70%; font-family:monospace;"></textarea></div>

    <hr><h4><i class="fa fa-paper-plane"></i> 手动测试</h4>
    <div class="form-row"><label>测试 URL</label><input type="text" id="node-input-testUrl"></div>
    <div class="form-row"><label>测试请求体</label><textarea id="node-input-testBody" rows="4" style="width:70%; font-family:monospace;"></textarea></div>
    <div class="form-row"><label>&nbsp;</label><button type="button" class="red-ui-button" id="btn-send-test"><i class="fa fa-paper-plane"></i> 发送测试</button></div>
    <div class="form-row"><label>结果</label><pre id="test-result-output" style="width:70%; min-height:80px; max-height:200px; overflow:auto; background:#f4f4f4; border:1px solid #ddd; padding:6px; font-size:12px;"></pre></div>
</script>

<script type="text/html" data-help-name="workflow-api-trigger">
    <p>把外部系统的 HTTP 回调（例如 MES 打印完成信号）绑定到工作流引擎中的某个 sequence 步骤。</p>
    <p>导出后由 exporter 写入 group_X.json 顶层 <code>api_triggers</code>，运行时由视频进程内的入站 HTTP 服务接收。</p>
    <p><b>使用步骤</b></p>
    <ol>
        <li>在 exporter 中开启 API 服务并配置监听 Host/端口。</li>
        <li>本节点配置触发器ID、群组、HTTP 路径、目标步骤ID。</li>
        <li>把节点串到 exporter 之前的汇聚节点。</li>
        <li>使用「发送测试」按钮模拟一次 MES 调用，确认 sequence 流程被推进。</li>
    </ol>
</script>
