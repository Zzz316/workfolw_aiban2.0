<script type="text/javascript">
    RED.nodes.registerType("aiban-custom-flow", {
        category: "AiBan Workflow",
        color: "#c7e9ff",
        defaults: {
            name: { value: "" },
            workflowId: { value: "group/1/scene/custom-flow", required: true },
            sceneId: { value: "custom-flow", required: true },
            initialState: { value: "start" },
            cycleTimeoutMs: { value: 30000 },
            resumeAfterRestart: { value: false },
            varsJson: { value: "{\n  \"hit_count\": { \"type\": \"counter\", \"initial\": 0 },\n  \"approved\": { \"type\": \"bool\", \"initial\": false }\n}" },
            timersJson: { value: "{\n  \"process_timer\": { \"timeout_ms\": 5000 }\n}" },
            statesJson: { value: "[\n  {\n    \"id\": \"start\",\n    \"scan\": [\n      { \"id\": \"hit-a\", \"label_id\": \"A\", \"actions\": [ { \"inc\": \"hit_count\" }, { \"start_timer\": \"process_timer\" } ] },\n      { \"id\": \"approve\", \"label_id\": \"B\", \"guard\": { \"var\": \"hit_count\", \"op\": \">=\", \"value\": 1 }, \"actions\": [ { \"set\": { \"var\": \"approved\", \"value\": true } } ] }\n    ],\n    \"transitions\": [\n      { \"when\": { \"var\": \"approved\", \"op\": \"==\", \"value\": true }, \"goto\": \"done\", \"actions\": [ { \"outcome\": { \"status\": \"OK\", \"code\": \"CUSTOM_FLOW_COMPLETED\" } } ] }\n    ],\n    \"on_timer_expire\": [\n      { \"timer\": \"process_timer\", \"actions\": [ { \"outcome\": { \"status\": \"TIMEOUT\", \"code\": \"CUSTOM_FLOW_TIMER_TIMEOUT\", \"reason\": \"B did not arrive in time\" } } ] }\n    ]\n  },\n  { \"id\": \"done\", \"scan\": [], \"transitions\": [] }\n]" }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["outcome", "diagnostic"],
        icon: "font-awesome/fa-code-fork",
        label: function() { return this.name || "aiban custom flow"; },
        paletteLabel: "custom flow"
    });
</script>

<script type="text/html" data-template-name="aiban-custom-flow">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-workflowId"><i class="fa fa-sitemap"></i> Workflow</label>
        <input type="text" id="node-input-workflowId">
    </div>
    <div class="form-row">
        <label for="node-input-sceneId"><i class="fa fa-object-group"></i> Scene</label>
        <input type="text" id="node-input-sceneId">
    </div>
    <div class="form-row">
        <label for="node-input-initialState"><i class="fa fa-play"></i> 初始状态</label>
        <input type="text" id="node-input-initialState">
    </div>
    <div class="form-row">
        <label for="node-input-cycleTimeoutMs"><i class="fa fa-clock-o"></i> 超时 ms</label>
        <input type="number" id="node-input-cycleTimeoutMs">
    </div>
    <div class="form-row">
        <label for="node-input-resumeAfterRestart"><i class="fa fa-refresh"></i> Deploy 恢复</label>
        <input type="checkbox" id="node-input-resumeAfterRestart" style="display:inline-block;width:auto;">
    </div>
    <div class="form-row">
        <label for="node-input-varsJson"><i class="fa fa-cubes"></i> Vars JSON</label>
        <textarea id="node-input-varsJson" style="width:70%;height:110px;font-family:monospace;"></textarea>
    </div>
    <div class="form-row">
        <label for="node-input-timersJson"><i class="fa fa-hourglass-half"></i> Timers JSON</label>
        <textarea id="node-input-timersJson" style="width:70%;height:90px;font-family:monospace;"></textarea>
    </div>
    <div class="form-row">
        <label for="node-input-statesJson"><i class="fa fa-random"></i> States JSON</label>
        <textarea id="node-input-statesJson" style="width:70%;height:260px;font-family:monospace;"></textarea>
    </div>
</script>

<script type="text/html" data-help-name="aiban-custom-flow">
    <p>Runs a controlled Custom Flow DSL with vars, timers, JSON guards and standard workflow outcomes.</p>
</script>
