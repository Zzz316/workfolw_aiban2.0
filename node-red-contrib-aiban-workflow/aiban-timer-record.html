<script type="text/javascript">
    RED.nodes.registerType("aiban-timer-record", {
        category: "艾班工作流", color: "#D8C4F1",
        defaults: {
            name: { value: "Timer Record 2.0" },
            workflowId: { value: "group/1/scene/timer", required: true },
            sceneId: { value: "timer", required: true },
            startLabel: { value: "start", required: true },
            endLabel: { value: "end", required: true },
            maxDurationMs: { value: 28800000, validate: RED.validators.number() },
            absenceJson: { value: "null" },
            resumeAfterRestart: { value: false }
        },
        inputs: 1, outputs: 2,
        outputLabels: ["标准 outcome", "timer state"],
        icon: "font-awesome/fa-clock-o",
        label: function () { return this.name || "Timer Record 2.0"; }
    });
</script>
<script type="text/html" data-template-name="aiban-timer-record">
    <div class="form-row"><label>名称</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label>Workflow ID</label><input type="text" id="node-input-workflowId"></div>
    <div class="form-row"><label>Scene ID</label><input type="text" id="node-input-sceneId"></div>
    <div class="form-row"><label>开始标签</label><input type="text" id="node-input-startLabel"></div>
    <div class="form-row"><label>结束标签</label><input type="text" id="node-input-endLabel"></div>
    <div class="form-row"><label>最长工时(ms)</label><input type="number" id="node-input-maxDurationMs"></div>
    <div class="form-row"><label>离岗 JSON</label><textarea id="node-input-absenceJson" rows="5" style="width:70%"></textarea></div>
    <div class="form-row"><label>重启续计时</label><input type="checkbox" id="node-input-resumeAfterRestart"></div>
</script>
<script type="text/html" data-help-name="aiban-timer-record"><p>start/end guard、离岗累计、超时、Deploy 恢复策略和标准工时 outcome。</p></script>
