<script type="text/javascript">
    RED.nodes.registerType('workflow-state', {
        category: 'Aiban 引擎', color: '#D8BFD8',
        defaults: {
            name: { value: "用户自定义流程" }, groupId: { value: "" }, modelId: { value: "" },
            vars: { value: [] }, timers: { value: [] }, statesJson: { value: "" },
            _groupCameraMap: { value: {} }, _modelMap: { value: {} }
        },
        inputs: 1, outputs: 1, icon: "font-awesome/fa-sitemap",
        paletteLabel: "state",
        label: function() { return this.name || "自定义流程"; },
        oneditprepare: function() {
            var node = this;

            var tabs = RED.tabs.create({
                id: "node-state-tabs",
                onchange: function(tab) {
                    $("#node-state-tabs-content").children().hide();
                    $("#" + tab.id).show();
                    if (tab.id === "state-tab-logic" && node.editor) node.editor.layout();
                }
            });
            tabs.addTab({ id: "state-tab-basic", label: "基础配置" });
            tabs.addTab({ id: "state-tab-vars", label: "变量/计时器" });
            tabs.addTab({ id: "state-tab-logic", label: "流程跳转逻辑" });

            function updateDropdowns() {
                $('#node-input-groupId').empty().append('<option value="">选择群组</option>');
                if (node._groupCameraMap) Object.keys(node._groupCameraMap).forEach(gid => $('#node-input-groupId').append($('<option>', {value:gid, text:"Group "+gid})));
                $('#node-input-groupId').val(node.groupId);

                $('#node-input-modelId').empty().append('<option value="">选择模型</option>');
                if (node._modelMap) Object.keys(node._modelMap).forEach(mid => $('#node-input-modelId').append($('<option>', {value:mid, text:node._modelMap[mid].modelName+"(ID:"+mid+")"})));
                $('#node-input-modelId').val(node.modelId);
            }

            $.getJSON("/aiban/global-yaml", function(data) {
                if (data && Object.keys(data.groupCameraMap || {}).length > 0) {
                    node._groupCameraMap = data.groupCameraMap; if(data.modelMap) node._modelMap = data.modelMap; updateDropdowns();
                }
            });

            $('#btn-upload').click(function(e) {
                e.preventDefault();
                aibanBrowseServerYaml(function(data) {
                    node._groupCameraMap = data.groupCameraMap; node._modelMap = data.modelMap; updateDropdowns();
                });
            });
            
            updateDropdowns();

            $('#node-input-vars-container').editableList({
                addItem: function(container, i, opt) {
                    var v = opt.name ? opt : { name: "my_var"+(i+1), vtype: "counter", vdefault: "" };
                    container.css({ display: 'flex', gap: '5px' });
                    $('<input/>', {class:"var-name", type:"text", placeholder:"变量名", style:"width:35%"}).val(v.name).appendTo(container);
                    var typeSel = $('<select/>', {class:"var-type", style:"width:30%"}).appendTo(container);
                    typeSel.append('<option value="counter">计数器 (counter)</option><option value="bool">布尔 (bool)</option><option value="tracker">追踪器 (tracker)</option>').val(v.vtype);
                    $('<input/>', {class:"var-def", type:"text", placeholder:"默认值(仅bool填true/false)", style:"width:35%"}).val(v.vdefault).appendTo(container);
                }, removable: true
            });
            if (node.vars) node.vars.forEach(v => $('#node-input-vars-container').editableList('addItem', v));

            $('#node-input-timers-container').editableList({
                addItem: function(container, i, opt) {
                    var t = opt.name ? opt : { name: "timer"+(i+1), timeout: "" };
                    container.css({ display: 'flex', gap: '5px' });
                    $('<input/>', {class:"timer-name", type:"text", placeholder:"计时器名", style:"width:50%"}).val(t.name).appendTo(container);
                    $('<input/>', {class:"timer-timeout", type:"number", step:"0.1", placeholder:"超时秒数(可选)", style:"width:50%"}).val(t.timeout).appendTo(container);
                }, removable: true
            });
            if (node.timers) node.timers.forEach(t => $('#node-input-timers-container').editableList('addItem', t));

            this.editor = RED.editor.createEditor({ id: 'node-input-states-editor', mode: 'ace/mode/json', value: node.statesJson || getDefaultStateTemplate() });

            $('#btn-insert-alarm-db-template').click(function(e) {
                e.preventDefault();
                var gid = parseInt($('#node-input-groupId').val()) || 0;
                var template = JSON.stringify(getAlarmDbActionTemplate(gid), null, 2);
                node.editor.insert(template);
                node.editor.focus();
            });

            function getAlarmDbActionTemplate(groupId) {
                return {
                    save_db: {
                        table: "icamera_data.icam_alarm_data",
                        fields: {
                            day: "$date",
                            time: "$time",
                            time_division: "$time_division",
                            time_month: "$time_month",
                            week: "$week",
                            region: "",
                            group_id: groupId,
                            camera_id: "$sourceid",
                            alarm_content: "这里填写 icam_alarmname_data.alarmname",
                            img_path: "",
                            timedate: "$datetime",
                            alarm_status: "NG"
                        }
                    }
                };
            }

            function getDefaultStateTemplate() {
                return `[\n  {\n    "id": "state_1",\n    "scan": [\n      {\n        "label": "start",\n        "confidence": 0.8,\n        "on_found": [\n          { "log": "找到起始点，变量加1" },\n          { "inc": "my_counter" }\n        ]\n      },\n      {\n        "label": "桌面",\n        "confidence": 0.9,\n        "sub_model_id": 7,\n        "sub_scan": [\n          {\n            "label": "子目标",\n            "confidence": 0.8,\n            "on_found": [ { "log": "二阶子框内检测到目标" } ]\n          }\n        ]\n      }\n    ],\n    "transitions": [\n      {\n        "when": "my_counter.get() >= 5",\n        "goto": "state_2",\n        "log": "满足条件，进入阶段 2"\n      }\n    ]\n  },\n  {\n    "id": "state_2",\n    "scan": [],\n    "transitions": []\n  }\n]`;
            }
        },
        oneditsave: function() {
            var node = this; node.vars = []; node.timers = [];
            $('#node-input-vars-container').editableList('items').each(function() { node.vars.push({ name: $(this).find(".var-name").val(), vtype: $(this).find(".var-type").val(), vdefault: $(this).find(".var-def").val() }); });
            $('#node-input-timers-container').editableList('items').each(function() { node.timers.push({ name: $(this).find(".timer-name").val(), timeout: $(this).find(".timer-timeout").val() }); });
            node.statesJson = this.editor.getValue(); this.editor.destroy(); delete this.editor;
        },
        oneditcancel: function() { this.editor.destroy(); delete this.editor; }
    });
</script>

<script type="text/html" data-template-name="workflow-state">
    <div class="form-row"><ul style="min-width: 600px; margin-bottom: 20px;" id="node-state-tabs"></ul></div>
    <div id="node-state-tabs-content" style="min-height: 350px;">
        <div id="state-tab-basic" style="display:none">
            <div class="form-row"><button type="button" class="red-ui-button" id="btn-upload" style="width: 100%;"><i class="fa fa-folder-open"></i> 选择服务器 YAML 解析</button></div>
            <div class="form-row"><label>节点名称</label><input type="text" id="node-input-name"></div>
            <div class="form-row"><label>群组 / 模型</label><select id="node-input-groupId" style="width:30%"></select> <select id="node-input-modelId" style="width:38%"></select></div>
        </div>
        <div id="state-tab-vars" style="display:none">
            <div class="form-row" style="margin-bottom:0;"><label><i class="fa fa-cube"></i> 声明变量 (Vars)</label></div>
            <div class="form-row"><ol id="node-input-vars-container" style="height: 120px;"></ol></div><hr>
            <div class="form-row" style="margin-bottom:0;"><label><i class="fa fa-clock-o"></i> 声明计时器 (Timers)</label></div>
            <div class="form-row"><ol id="node-input-timers-container" style="height: 120px;"></ol></div>
        </div>
        <div id="state-tab-logic" style="display:none; height: 100%;">
            <div class="form-row" style="margin-bottom: 5px;">
                <label style="width: 100%;"><i class="fa fa-code"></i> 流程状态定义 (JSON)</label>
                <div style="font-size: 12px; color: #666; margin-bottom: 8px;"><b>提示：</b>用户可通过 states / transitions / actions 自定义流程，支持二阶模型子框检测。</div>
                <button type="button" class="red-ui-button" id="btn-insert-alarm-db-template" style="margin-bottom:8px;"><i class="fa fa-database"></i> 插入报警入库动作模板</button>
            </div>
            <div class="form-row node-text-editor-row" style="height: 270px; border: 1px solid #ccc;"><div id="node-input-states-editor" class="node-text-editor" style="height: 100%;"></div></div>
        </div>
    </div>
</script>
