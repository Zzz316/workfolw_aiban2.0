<script type="text/javascript">
    RED.nodes.registerType('workflow-sequence', {
        category: 'Aiban 引擎',
        color: '#E2D96E',
        defaults: {
            name: { value: "步骤顺序检测" },
            groupId: { value: "" },
            modelId: { value: "" },
            ordered: { value: false },
            timeout: { value: 999999.0 },
            alarmMsg: { value: "" },
            cooldown: { value: 10 },
            saveResult: { value: false },
            resultTable: { value: "icamera_data.icam_alarm_data" },
            okAlarmName: { value: "流程OK" },
            enableCycle: { value: false },
            cycleMasterTable: { value: "icamera_data.production_cycle_record" },
            cycleDetailTable: { value: "icamera_data.step_execution_log" },
            enablePresence: { value: false },
            personLabel: { value: "person" },
            personConf: { value: 0.5 },
            presenceDuration: { value: 30 },
            presenceAlarmName: { value: "" },
            enableLoopMode: { value: false },
            loopSegments: { value: [] },
            loopOutOfOrderAlarm: { value: "动作顺序错误" },
            loopOutOfOrderCooldown: { value: 10 },
            speak: { value: false },
            steps: { value: [] },
            _groupCameraMap: { value: {} },
            _modelMap: { value: {} },
            _groupInferMap: { value: {} }
        },
        inputs: 1, outputs: 1, icon: "font-awesome/fa-list-ol",
        paletteLabel: "sequence",
        label: function() { return this.name || "步骤顺序检测"; },
        oneditprepare: function() {
            var node = this;

            // ── 工具：子模型/子标签下拉 ──
            function buildSubModelOptions(selectElem, savedVal) {
                selectElem.empty().append('<option value="">选择模型</option>');
                if (node._modelMap) {
                    Object.keys(node._modelMap).forEach(function(mid) {
                        selectElem.append($('<option>', { value: mid, text: mid + " (" + node._modelMap[mid].modelName + ")" }));
                    });
                }
                if (savedVal !== undefined && savedVal !== null && savedVal !== "") selectElem.val(String(savedVal));
            }

            function buildSubLabelOptions(selectElem, subId, savedVal) {
                selectElem.empty().append('<option value="">请选择</option>');
                if (subId && node._modelMap && node._modelMap[subId] && node._modelMap[subId].labels) {
                    node._modelMap[subId].labels.forEach(function(lbl) {
                        var val = typeof lbl === 'object' ? (lbl.name || lbl.labelName) : lbl;
                        if (val) selectElem.append($('<option>', { value: val, text: val }));
                    });
                }
                if (savedVal) selectElem.val(savedVal);
            }

            function addSubModelRow(listContainer, data) {
                data = data || { model_id: "", label: "", confidence: 0.5 };
                var row = $('<div/>', { class: "sub-model-row", style: "display:flex; gap:6px; align-items:center; margin-top:4px;" }).appendTo(listContainer);

                row.append('<span style="font-size:12px; color:#333; white-space:nowrap;">模型:</span>');
                var midSel = $('<select/>', { class: "sub-mid", style: "flex:1; min-width:90px;" }).appendTo(row);

                row.append('<span style="font-size:12px; color:#333; white-space:nowrap;">标签:</span>');
                var lblSel = $('<select/>', { class: "sub-lbl", style: "flex:1; min-width:80px;" }).appendTo(row);

                row.append('<span style="font-size:12px; color:#333; white-space:nowrap;">置信度≥</span>');
                $('<input/>', { class: "sub-conf", type: "number", step: "0.1", style: "width:55px; flex-shrink:0;" }).val(data.confidence || 0.5).appendTo(row);

                $('<button/>', { type: "button", class: "red-ui-button", style: "flex-shrink:0;", title: "删除此子模型" })
                    .append('<i class="fa fa-times"></i>')
                    .click(function() { row.remove(); })
                    .appendTo(row);

                buildSubModelOptions(midSel, data.model_id);
                buildSubLabelOptions(lblSel, data.model_id, data.label);
                midSel.change(function() { buildSubLabelOptions(lblSel, $(this).val(), ""); });
            }

            $('#node-input-steps-container').editableList({
                addItem: function(container, i, opt) {
                    var step = opt.id ? opt : { id: "step" + (i + 1), label: "", confidence: 0.5, count: "" };

                    container.css({ display: 'flex', flexDirection: 'column', gap: '6px', paddingBottom: '6px' });

                    // 第一行：基础目标配置
                    var row1 = $('<div/>', { style: "display:flex; gap:6px; align-items:center; flex-wrap:wrap; width:100%;" }).appendTo(container);

                    row1.append('<span style="font-size:12px; color:#555; font-weight:bold; white-space:nowrap;">步骤ID:</span>');
                    $('<input/>', { class: "step-id", type: "text", style: "width:60px; flex-shrink:0;" }).val(step.id).appendTo(row1);

                    row1.append('<span style="font-size:12px; color:#555; white-space:nowrap;">目标:</span>');
                    var modelSel = $('<select/>', { class: "step-model", style: "flex:1; min-width:85px;", title: "可独立覆盖一阶模型" }).appendTo(row1);
                    modelSel.data('saved-val', step.model_id || "");

                    var labelSel = $('<select/>', { class: "step-label", style: "flex:1; min-width:85px;" }).appendTo(row1);
                    labelSel.data('saved-val', step.label);

                    row1.append('<span style="font-size:12px; color:#555; white-space:nowrap;">置信度≥</span>');
                    $('<input/>', { class: "step-conf", type: "number", step: "0.1", style: "width:55px; flex-shrink:0;" }).val(step.confidence).appendTo(row1);

                    var subLabelWrapper = $('<label/>', { style: "margin:0 0 0 6px; display:flex; align-items:center; font-size:12px; cursor:pointer; color:#0066cc; font-weight:bold; white-space:nowrap;" }).appendTo(row1);
                    var subCheck = $('<input/>', { class: "step-has-sub", type: "checkbox", style: "margin:0 4px 0 0; width:auto; height:auto;" }).appendTo(subLabelWrapper);
                    subLabelWrapper.append("二阶子框");

                    var extWrapper = $('<label/>', { style: "margin:0 0 0 6px; display:flex; align-items:center; font-size:12px; cursor:pointer; color:#1f78b4; font-weight:bold; white-space:nowrap;", title: "勾选后，该步骤不依赖视觉识别，由外部 API 触发器命中" }).appendTo(row1);
                    var extCheck = $('<input/>', { class: "step-external", type: "checkbox", style: "margin:0 4px 0 0; width:auto; height:auto;" }).appendTo(extWrapper);
                    extWrapper.append("API 触发");
                    if (step.external === true) extCheck.prop('checked', true);

                    // 第二行：业务规则
                    var row2 = $('<div/>', { style: "display:flex; gap:6px; align-items:center; flex-wrap:wrap; width:100%; margin-top: 2px;" }).appendTo(container);

                    row2.append('<span style="font-size:12px; color:#555; white-space:nowrap;" title="要求同一画面中出现的数量">数量:</span>');
                    $('<input/>', { class: "step-count", type: "number", placeholder: "不限", style: "width:50px; flex-shrink:0;" }).val(step.count).appendTo(row2);

                    row2.append('<span style="font-size:12px; color:#555; white-space:nowrap;" title="要求该目标连续稳定存在的秒数">持续(秒):</span>');
                    $('<input/>', { class: "step-duration", type: "number", step: "0.1", placeholder: "不限", style: "width:55px; flex-shrink:0;" }).val(step.duration || "").appendTo(row2);

                    row2.append('<span style="font-size:12px; color:#555; white-space:nowrap;" title="此步骤漏检或数量不对时的报警名称">NG报错名:</span>');
                    $('<input/>', { class: "step-alarm-name", type: "text", placeholder: "如:漏插1", style: "flex:1; min-width:100px;" }).val(step.alarm_name || "").appendTo(row2);

                    row2.append('<span style="font-size:12px; color:#555; white-space:nowrap;" title="工序代号，写入子表 step_config_id，需与 icam_camera_step_config 对齐，如 D1">步骤代号:</span>');
                    $('<input/>', { class: "step-code", type: "text", placeholder: "如:D1", style: "width:70px; flex-shrink:0;" }).val(step.step_code || "").appendTo(row2);

                    var triggerSel = $('<select/>', { class: "step-trigger", style: "width:85px; flex-shrink:0;", title: "该步骤是否作为新流程的起点触发器" }).appendTo(row2);
                    triggerSel.append('<option value="">触发:默认</option>');
                    triggerSel.append('<option value="true">触发:true</option>');
                    triggerSel.append('<option value="false">触发:false</option>');
                    if (step.trigger === true) triggerSel.val("true");
                    else if (step.trigger === false) triggerSel.val("false");
                    else triggerSel.val("");

                    var endLabel = $('<label/>', { style: "margin:0 0 0 4px; display:flex; align-items:center; font-size:12px; cursor:pointer; color:#d62728; font-weight:bold; white-space:nowrap;" }).appendTo(row2);
                    var endCheck = $('<input/>', { class: "step-end", type: "checkbox", style: "margin:0 4px 0 0; width:auto; height:auto;" }).appendTo(endLabel);
                    endLabel.append("设为End");
                    if (step.end === true) endCheck.prop('checked', true);

                    // 第三行：二阶子框列表
                    var row3 = $('<div/>', { class: "step-sub-row", style: "display:none; flex-direction:column; gap:4px; padding:6px 8px; background:#eef4fb; border-radius:4px; border:1px dashed #b1cce8; width:100%; box-sizing:border-box; margin-top:2px;" }).appendTo(container);

                    var subHeader = $('<div/>', { style: "display:flex; align-items:center; gap:8px;" }).appendTo(row3);
                    subHeader.append('<span style="font-size:12px; color:#333;"><i class="fa fa-level-down"></i> 二阶子模型（同模型多行=OR，不同模型=AND）:</span>');
                    var addSubBtn = $('<button/>', { type: "button", class: "red-ui-button red-ui-button-small", style: "margin-left:auto;" })
                        .append('<i class="fa fa-plus"></i> 添加子模型')
                        .appendTo(subHeader);

                    var subList = $('<div/>', { class: "step-sub-list", style: "display:flex; flex-direction:column; gap:4px;" }).appendTo(row3);
                    addSubBtn.click(function() { addSubModelRow(subList, null); });

                    // 联动逻辑
                    function populateStepModel(selectElem) {
                        selectElem.empty().append('<option value="">[全局默认]</option>');
                        if (node._modelMap) {
                            Object.keys(node._modelMap).forEach(mid => {
                                selectElem.append($('<option>', { value: mid, text: "M" + mid + ":" + node._modelMap[mid].modelName }));
                            });
                        }
                        var savedVal = selectElem.data('saved-val');
                        if (savedVal) selectElem.val(savedVal);
                    }

                    subCheck.change(function() {
                        if ($(this).is(':checked')) row3.css('display', 'flex');
                        else row3.hide();
                    });

                    function syncExternalStepUI() {
                        var enabled = extCheck.is(':checked');
                        if (enabled) {
                            modelSel.prop('disabled', true).val('');
                            labelSel.prop('disabled', true).empty().append('<option value="">[API触发:使用步骤ID]</option>');
                            labelSel.data('saved-val', '');
                            $('.step-conf', row1).val(0).prop('disabled', true);
                            if (triggerSel.val() === '') triggerSel.val('false');
                            subCheck.prop('checked', false).prop('disabled', true).trigger('change');
                        } else {
                            modelSel.prop('disabled', false);
                            labelSel.prop('disabled', false);
                            $('.step-conf', row1).prop('disabled', false);
                            subCheck.prop('disabled', false);
                            populateStepModel(modelSel);
                            populateStepLabel(labelSel, modelSel);
                        }
                    }

                    extCheck.change(syncExternalStepUI);

                    modelSel.change(function() {
                        labelSel.data('saved-val', "");
                        populateStepLabel(labelSel, $(this));
                    });

                    labelSel.change(function() {
                        var selectedName = $(this).val();
                        var effectiveMid = modelSel.val() || $('#node-input-modelId').val();
                        var gid = $('#node-input-groupId').val();

                        if (effectiveMid && node._modelMap[effectiveMid] && gid && node._groupInferMap && node._groupInferMap[gid]) {
                            var labelObj = node._modelMap[effectiveMid].labels.find(l => (typeof l === 'object' ? (l.name || l.labelName) : l) === selectedName);
                            if (labelObj && typeof labelObj === 'object' && labelObj.sign !== undefined) {
                                var mappedSubId = node._groupInferMap[gid][String(labelObj.sign)];
                                if (mappedSubId !== undefined && subList.children().length === 0) {
                                    subCheck.prop('checked', true).trigger('change');
                                    addSubModelRow(subList, { model_id: mappedSubId, label: "", confidence: 0.5 });
                                }
                            }
                        }
                    });

                    // 恢复已保存的 sub_models；兼容旧 sub_model_id+sub_label
                    var initialSubs = [];
                    if (Array.isArray(step.sub_models) && step.sub_models.length > 0) {
                        step.sub_models.forEach(function(sm) {
                            var mid = sm.model_id;
                            (sm.labels || []).forEach(function(lbl) {
                                initialSubs.push({ model_id: mid, label: lbl.name || "", confidence: lbl.confidence || 0.5 });
                            });
                            if (!sm.labels || sm.labels.length === 0) {
                                initialSubs.push({ model_id: mid, label: "", confidence: 0.5 });
                            }
                        });
                    } else if (step.sub_model_id && step.sub_label) {
                        initialSubs.push({
                            model_id: step.sub_model_id,
                            label: step.sub_label.name || "",
                            confidence: step.sub_label.confidence || 0.5
                        });
                    }

                    if (initialSubs.length > 0) {
                        subCheck.prop('checked', true);
                        row3.css('display', 'flex');
                        initialSubs.forEach(function(s) { addSubModelRow(subList, s); });
                    }

                    populateStepModel(modelSel);
                    populateStepLabel(labelSel, modelSel);
                    if (step.external === true) syncExternalStepUI();
                }, removable: true
            });

            function populateStepLabel(labelElem, modelElem) {
                if (labelElem.closest('li').find('.step-external').is(':checked')) {
                    labelElem.empty().append('<option value="">[API触发:使用步骤ID]</option>');
                    return;
                }
                labelElem.empty().append('<option value="">Label</option>');
                var effectiveMid = modelElem.val() || $('#node-input-modelId').val();
                if (effectiveMid && node._modelMap && node._modelMap[effectiveMid] && node._modelMap[effectiveMid].labels) {
                    node._modelMap[effectiveMid].labels.forEach(lbl => {
                        var val = typeof lbl === 'object' ? (lbl.name || lbl.labelName) : lbl;
                        if (val) labelElem.append($('<option>', { value: val, text: val }));
                    });
                }
                var savedVal = labelElem.data('saved-val');
                if (savedVal) labelElem.val(savedVal);
                setTimeout(function() { labelElem.trigger('change'); }, 50);
            }

            function updateAllStepLabels() {
                $('.step-label').each(function() {
                    if ($(this).closest('li').find('.step-external').is(':checked')) return;
                    var currentVal = $(this).val() || $(this).data('saved-val');
                    $(this).data('saved-val', currentVal);
                    var modelElem = $(this).siblings('.step-model');
                    if (!modelElem.val()) {
                        populateStepLabel($(this), modelElem);
                    }
                });

                $('.step-model').each(function() {
                    if ($(this).closest('li').find('.step-external').is(':checked')) return;
                    var currentVal = $(this).val() || $(this).data('saved-val');
                    $(this).data('saved-val', currentVal);
                    $(this).empty().append('<option value="">[全局默认]</option>');
                    var self = this;
                    if (node._modelMap) Object.keys(node._modelMap).forEach(mid => $(self).append($('<option>', { value: mid, text: "M" + mid + ":" + node._modelMap[mid].modelName })));
                    if (currentVal) $(this).val(currentVal);
                });
            }

            function updateDropdowns() {
                $('#node-input-groupId').empty().append('<option value="">选择群组</option>');
                if (node._groupCameraMap) Object.keys(node._groupCameraMap).forEach(gid => $('#node-input-groupId').append($('<option>', { value: gid, text: "Group " + gid })));
                $('#node-input-groupId').val(node.groupId);

                $('#node-input-modelId').empty().append('<option value="">选择模型</option>');
                if (node._modelMap) Object.keys(node._modelMap).forEach(mid => $('#node-input-modelId').append($('<option>', { value: mid, text: node._modelMap[mid].modelName + "(ID:" + mid + ")" })));
                $('#node-input-modelId').val(node.modelId);
                updateAllStepLabels();
            }

            $('#node-input-modelId').change(updateAllStepLabels);

            $.getJSON("/aiban/global-yaml", function(data) {
                if (data && Object.keys(data.groupCameraMap || {}).length > 0) {
                    node._groupCameraMap = data.groupCameraMap;
                    node._modelMap = data.modelMap;
                    node._groupInferMap = data.groupInferMap;
                    updateDropdowns();
                }
            });

            $('#btn-upload').click(function(e) {
                e.preventDefault();
                aibanBrowseServerYaml(function(data) {
                    node._groupCameraMap = data.groupCameraMap;
                    node._modelMap = data.modelMap;
                    node._groupInferMap = data.groupInferMap;
                    updateDropdowns();
                });
            });

            updateDropdowns();
            if (node.steps) node.steps.forEach(s => $('#node-input-steps-container').editableList('addItem', s));

            // 周期主子表名兜底：旧节点字段为空时填入默认表名
            if (!$('#node-input-cycleMasterTable').val()) $('#node-input-cycleMasterTable').val("icamera_data.production_cycle_record");
            if (!$('#node-input-cycleDetailTable').val()) $('#node-input-cycleDetailTable').val("icamera_data.step_execution_log");

            // 人员在场检测面板联动
            $('#node-input-enablePresence').change(function() {
                if ($(this).is(':checked')) $('#presence-panel').slideDown();
                else $('#presence-panel').slideUp();
            });
            if (node.enablePresence) $('#presence-panel').show();

            // 填充人员标签下拉框
            function populatePersonLabelDropdown() {
                $('#node-input-personLabel').empty().append('<option value="">选择人员标签</option>');
                var effectiveMid = $('#node-input-modelId').val();
                if (effectiveMid && node._modelMap && node._modelMap[effectiveMid] && node._modelMap[effectiveMid].labels) {
                    node._modelMap[effectiveMid].labels.forEach(lbl => {
                        var val = typeof lbl === 'object' ? (lbl.name || lbl.labelName) : lbl;
                        if (val) $('#node-input-personLabel').append($('<option>', { value: val, text: val }));
                    });
                }
                $('#node-input-personLabel').val(node.personLabel || "person");
            }
            $('#node-input-modelId').change(populatePersonLabelDropdown);
            populatePersonLabelDropdown();

            // 循环模式面板联动
            $('#node-input-enableLoopMode').change(function() {
                if ($(this).is(':checked')) $('#loop-panel').slideDown();
                else $('#loop-panel').slideUp();
            });
            if (node.enableLoopMode) $('#loop-panel').show();

            // ── 循环段可编辑列表 ──────────────────────────────
            function populateOneStepDropdown(selectElem, savedVal) {
                if (!selectElem) return;
                var currentVal = selectElem.val() || savedVal || "";
                selectElem.empty();
                selectElem.append('<option value="">选择步骤</option>');
                $('#node-input-steps-container').editableList('items').each(function() {
                    var stepId = $(this).find('.step-id').val();
                    // label 是异步加载的 select，优先用 val()，其次用 data('saved-val')
                    var stepLabel = $(this).find('.step-label').val() || $(this).find('.step-label').data('saved-val') || "";
                    if (stepId) {
                        var displayText = stepLabel ? stepLabel + ' (' + stepId + ')' : stepId;
                        selectElem.append($('<option>', { value: stepId, text: displayText }));
                    }
                });
                if (currentVal) {
                    selectElem.val(currentVal);
                }
            }

            function populateAllLoopSegmentDropdowns() {
                $('#node-input-loopSegments-container').editableList('items').each(function() {
                    populateOneStepDropdown($(this).find('.lm-seg-step'));
                });
            }

            $('#node-input-loopSegments-container').editableList({
                addItem: function(container, i, opt) {
                    var seg = opt || { step_id: "", loop_count: 1 };
                    container.css({ display: 'flex', flexDirection: 'column', gap: '4px', paddingBottom: '6px', width: '100%', minWidth: 0, boxSizing: 'border-box' });
                    // Row 1: step_id + loop_count
                    var row1 = $('<div/>', { style: 'display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:3px; width:100%; min-width:0;' }).appendTo(container);
                    row1.append('<span style="font-size:12px;color:#555;">步骤ID:</span>');
                    var stepSel = $('<select/>', { class: 'lm-seg-step', style: 'flex:1 1 260px; min-width:0; max-width:100%;' }).appendTo(row1);
                    stepSel.append('<option value="">选择步骤</option>');
                    row1.append('<span style="font-size:12px;color:#555;">循环次数:</span>');
                    $('<input/>', { class: 'lm-seg-count', type: 'number', min: 1, style: 'width:60px; flex:0 0 60px;' })
                        .val(seg.loop_count || 1)
                        .appendTo(row1);

                    // Row 2: alt_step_ids (备选步骤，逗号分隔)
                    var row2 = $('<div/>', { style: 'display:flex; gap:6px; align-items:center; flex-wrap:wrap; width:100%; min-width:0;' }).appendTo(container);
                    row2.append('<span style="font-size:11px;color:#888;white-space:nowrap;">备选步骤(逗号分隔):</span>');
                    var altRaw = (seg.alt_step_ids || []).join(', ');
                    $('<input/>', { class: 'lm-seg-alts', type: 'text', style: 'flex:1; min-width:100px;', placeholder: '可选,如:stepC,stepD' })
                        .val(altRaw)
                        .appendTo(row2);

                    // Row 3: guard_step_ids + repeat_alarm_name (验证步骤 + 重复报警名)
                    var guardRaw = (seg.guard_step_ids || []).join(', ');
                    if (!guardRaw && seg.guard_step_ids_raw) guardRaw = seg.guard_step_ids_raw;
                    var row3 = $('<div/>', { style: 'display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:2px; width:100%; min-width:0;' }).appendTo(container);
                    row3.append('<span style="font-size:11px;color:#e65100;white-space:nowrap;">验证步骤:</span>');
                    $('<input/>', { class: 'lm-seg-guards', type: 'text', style: 'flex:1; min-width:100px;', placeholder: '逗号分隔,如:stepC' })
                        .val(guardRaw)
                        .appendTo(row3);
                    row3.append('<span style="font-size:11px;color:#e65100;white-space:nowrap;">重复报警名:</span>');
                    $('<input/>', { class: 'lm-seg-repeat-alarm', type: 'text', style: 'flex:1; min-width:80px;', placeholder: '如:步骤重复出现' })
                        .val(seg.repeat_alarm_name || "")
                        .appendTo(row3);

                    // Row 4: transition_step_ids + transition_alarm_name (过渡步骤 — 出现后报警/不报警)
                    var transRaw = (seg.transition_step_ids || []).join(', ');
                    if (!transRaw && seg.transition_step_ids_raw) transRaw = seg.transition_step_ids_raw;
                    var row4 = $('<div/>', { style: 'display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:2px; width:100%; min-width:0;' }).appendTo(container);
                    row4.append('<span style="font-size:11px;color:#2e7d32;white-space:nowrap;">过渡步骤:</span>');
                    $('<input/>', { class: 'lm-seg-transition', type: 'text', style: 'flex:1; min-width:100px;', placeholder: '逗号分隔,如:stepB' })
                        .val(transRaw)
                        .appendTo(row4);
                    row4.append('<span style="font-size:11px;color:#2e7d32;white-space:nowrap;">过渡报警名:</span>');
                    $('<input/>', { class: 'lm-seg-transition-alarm', type: 'text', style: 'flex:1; min-width:80px;', placeholder: '填报警名则B报警(不填则静默过渡)' })
                        .val(seg.transition_alarm_name || "")
                        .appendTo(row4);

                    // 填充步骤下拉框
                    populateOneStepDropdown(stepSel, seg.step_id || "");
                },
                addButton: true,
                removable: true,
                minimum: 1,
                maximum: 50,
                height: 190
            });

            // 恢复已保存的段列表
            if (node.loopSegments && node.loopSegments.length > 0) {
                node.loopSegments.forEach(function(seg) {
                    $('#node-input-loopSegments-container').editableList('addItem', seg);
                });
            } else {
                $('#node-input-loopSegments-container').editableList('addItem', { step_id: "", loop_count: 1 });
            }

            // 步骤列表变化时刷新所有段下拉框
            $('#node-input-steps-container').on('editableList.addItem editableList.removeItem', populateAllLoopSegmentDropdowns);
        },
        oneditsave: function() {
            var node = this;
            node.steps = [];
            $('#node-input-steps-container').editableList('items').each(function() {
                var el = $(this);
                var stepId = el.find(".step-id").val();
                var isExternal = el.find(".step-external").is(':checked');
                var s = {
                    id: stepId,
                    label: isExternal ? stepId : el.find(".step-label").val(),
                    confidence: isExternal ? 0 : (parseFloat(el.find(".step-conf").val()) || 0.5)
                };
                if (isExternal) s.external = true;

                var stepMid = el.find(".step-model").val();
                if (!isExternal && stepMid) s.model_id = parseInt(stepMid);

                var count = el.find(".step-count").val();
                if (count && parseInt(count) > 0) s.count = parseInt(count);
                var duration = el.find(".step-duration").val();
                if (duration && parseFloat(duration) > 0) s.duration = parseFloat(duration);
                var alarmName = el.find(".step-alarm-name").val();
                if (alarmName) s.alarm_name = alarmName;
                var stepCode = el.find(".step-code").val();
                if (stepCode) s.step_code = stepCode;

                var trigVal = el.find(".step-trigger").val();
                if (trigVal === "true") s.trigger = true;
                else if (trigVal === "false") s.trigger = false;
                else if (isExternal) s.trigger = false;

                if (el.find(".step-end").is(':checked')) s.end = true;

                if (!isExternal && el.find(".step-has-sub").is(':checked')) {
                    var grouped = {};
                    el.find(".sub-model-row").each(function() {
                        var rowEl = $(this);
                        var smid = parseInt(rowEl.find(".sub-mid").val());
                        var sname = rowEl.find(".sub-lbl").val();
                        var sconf = parseFloat(rowEl.find(".sub-conf").val()) || 0.5;
                        if (isNaN(smid) || !sname) return;
                        if (!grouped[smid]) grouped[smid] = { model_id: smid, labels: [] };
                        grouped[smid].labels.push({ name: sname, confidence: sconf });
                    });
                    var subModels = Object.values(grouped);
                    if (subModels.length > 0) s.sub_models = subModels;
                }
                node.steps.push(s);
            });

            // 序列化循环段列表
            node.loopSegments = [];
            $('#node-input-loopSegments-container').editableList('items').each(function() {
                var segStepId = $(this).find('.lm-seg-step').val();
                var segCount = parseInt($(this).find('.lm-seg-count').val()) || 1;
                var segAltsRaw = $(this).find('.lm-seg-alts').val() || "";

                // 验证步骤 / 过渡步骤为手写逗号分隔文本
                var segGuardsRaw = $(this).find('.lm-seg-guards').val() || "";
                var segTransRaw = $(this).find('.lm-seg-transition').val() || "";

                var segRepeatAlarm = $(this).find('.lm-seg-repeat-alarm').val() || "";
                var segTransAlarm = $(this).find('.lm-seg-transition-alarm').val() || "";
                if (segStepId) {
                    var segObj = { step_id: segStepId, loop_count: segCount };
                    if (segAltsRaw.trim()) segObj.alt_step_ids_raw = segAltsRaw.trim();
                    if (segGuardsRaw.trim()) segObj.guard_step_ids_raw = segGuardsRaw.trim();
                    if (segTransRaw.trim()) segObj.transition_step_ids_raw = segTransRaw.trim();
                    if (segRepeatAlarm) segObj.repeat_alarm_name = segRepeatAlarm;
                    if (segTransAlarm) segObj.transition_alarm_name = segTransAlarm;
                    node.loopSegments.push(segObj);
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="workflow-sequence">
    <div class="form-row">
        <button type="button" class="red-ui-button" id="btn-upload" style="width: 100%;"><i class="fa fa-folder-open"></i> 选择服务器 YAML (含二阶解析)</button>
    </div>
    <div class="form-row"><label>节点名称</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label>摄像头群组</label><select id="node-input-groupId" style="width:70%"></select></div>
    <div class="form-row"><label>默认模型</label><select id="node-input-modelId" style="width:70%"></select></div>
    <div class="form-row">
        <label>必须按顺序</label><input type="checkbox" id="node-input-ordered" style="display:inline-block; width:auto; vertical-align:top;">
        <span style="font-size: 12px; color: #666;"> (漏步时：立刻报警 / 不勾选无限等待)</span>
    </div>
    <div class="form-row"><label>步骤超时</label><input type="number" id="node-input-timeout" style="width:70%"></div>
    <div class="form-row"><label>报警冷却(秒)</label><input type="number" id="node-input-cooldown" style="width:70%"></div>
    <div class="form-row">
        <label>触发扬声器</label><input type="checkbox" id="node-input-speak" style="display:inline-block; width:auto; vertical-align:top;">
        <span style="font-size: 12px; color: #e65100;"> <i class="fa fa-volume-up"></i> 报警时同时发送喇叭播报指令（需配合 socket-client 节点配置喇叭地址）</span>
    </div>
    <hr>
    <div class="form-row">
        <label>结果入库</label><input type="checkbox" id="node-input-saveResult" style="display:inline-block; width:auto; vertical-align:top;">
        <span style="font-size: 12px; color: #666;"> 写入流程 OK/NG 结果</span>
    </div>
    <div class="form-row"><label>结果表名</label><input type="text" id="node-input-resultTable" style="width:70%" placeholder="icamera_data.icam_alarm_data"></div>
    <div class="form-row"><label>OK名称</label><input type="text" id="node-input-okAlarmName" style="width:70%" placeholder="需与 icam_alarmname_data.alarmname 对应"></div>
    <div class="form-row" style="font-size:12px;color:#666;margin-left:104px;">NG名称在每个步骤的“NG报错名”里配置，例如：插接1 → 排线漏插-插接1。</div>
    <hr>
    <div class="form-row">
        <label>生产周期入库</label><input type="checkbox" id="node-input-enableCycle" style="display:inline-block; width:auto; vertical-align:top;">
        <span style="font-size: 12px; color: #666;"> 主子表：周期总表 + 工序流水表(看板大屏数据源)</span>
    </div>
    <div class="form-row"><label>周期主表</label><input type="text" id="node-input-cycleMasterTable" style="width:70%" placeholder="icamera_data.production_cycle_record"></div>
    <div class="form-row"><label>工序子表</label><input type="text" id="node-input-cycleDetailTable" style="width:70%" placeholder="icamera_data.step_execution_log"></div>
    <div class="form-row" style="font-size:12px;color:#666;margin-left:104px;">开启后：流程开始写主表(生产中)，每步完成写子表流水(含启停时间)，流程结束更新主表 OK/NG。子表 step_config_id 取每个步骤的"步骤代号"。</div>
    <hr>
    <div class="form-row"><label style="width: auto; font-weight: bold;"><i class="fa fa-user-times"></i> 启用人员在场检测</label><input type="checkbox" id="node-input-enablePresence" style="display:inline-block; width:auto; vertical-align:top; margin-left: 10px;"></div>
    <div id="presence-panel" style="display: none; padding: 10px; background: #fff3e0; border: 1px dashed #ffb74d; border-radius: 4px; margin-bottom: 12px;">
        <div class="form-row" style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <span style="font-size:12px; color:#555; white-space:nowrap;">人员标签:</span>
            <select id="node-input-personLabel" style="flex:1; min-width:85px;"></select>
            <span style="font-size:12px; color:#555; white-space:nowrap;">置信度≥</span>
            <input type="number" step="0.1" id="node-input-personConf" style="width:55px;">
            <span style="font-size:12px; color:#555; white-space:nowrap;">离岗报警名:</span>
            <input type="text" id="node-input-presenceAlarmName" style="flex:1; min-width:100px;" placeholder="如:人员离岗">
        </div>
        <div class="form-row" style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px;">
            <span style="font-size:12px; color:#555; white-space:nowrap;">离岗持续(秒):</span>
            <input type="number" id="node-input-presenceDuration" style="width:70px;" min="1" value="30">
            <span style="font-size:11px; color:#999;">人员离开超过此时间触发报警，回归则重置计时</span>
        </div>
    </div>
    <div class="form-row" style="margin-bottom:0;"><label><i class="fa fa-list"></i> 检测步骤 (Steps)</label></div>
    <div class="form-row"><ol id="node-input-steps-container" style="min-height:200px;"></ol></div>
    <hr>
    <div class="form-row"><label style="width: auto; font-weight: bold;"><i class="fa fa-refresh"></i> 启用循环模式</label><input type="checkbox" id="node-input-enableLoopMode" style="display:inline-block; width:auto; vertical-align:top; margin-left: 10px;"></div>
    <div id="loop-panel" style="display: none; padding: 10px; background: #e8f5e9; border: 1px dashed #81c784; border-radius: 4px; margin-bottom: 12px;">
        <div class="form-row" style="margin-bottom:4px;">
            <span style="font-size:12px; color:#333; font-weight:bold;"><i class="fa fa-list-ol"></i> 循环段（按顺序执行）:</span>
        </div>
        <div class="form-row">
            <ol id="node-input-loopSegments-container" style="min-height:190px;"></ol>
        </div>
        <div class="form-row" style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px;">
            <span style="font-size:12px; color:#555; white-space:nowrap;">越序报警名:</span>
            <input type="text" id="node-input-loopOutOfOrderAlarm" style="flex:1; min-width:100px;" placeholder="如:动作顺序错误">
            <span style="font-size:12px; color:#555; white-space:nowrap;">冷却(秒):</span>
            <input type="number" id="node-input-loopOutOfOrderCooldown" style="width:60px;" min="0" value="10">
        </div>
        <details id="loop-help" class="form-row">
            <summary>查看循环模式说明和示例</summary>
            <div class="loop-help-body">
                说明：每个段配置一个步骤ID和循环次数。循环次数 = 物体"出现→消失"的次数（非帧计数）。<br>
                当前段达到循环次数后自动进入下一段；最后一段完成后回到第一段，完成一个完整周期。<br>
                当前段执行期间，如果后序段的步骤提前出现，则触发越序报警（需本段已激活）。<br>
                <span style="color:#2e7d32;">过渡步骤</span>：循环次数达到后进入 guard 阶段。填写过渡报警名时，过渡步骤出现会报警；不填写时静默进入监控态。<br>
                <span style="color:#e65100;">验证步骤</span>出现后清空计数并重置本段。验证步骤、过渡步骤均为手写输入，逗号分隔多个步骤ID。<br>
                示例1：段A(3次)→段B(1次)表示 A出现消失3次后，B出现消失1次，回到A重新开始。<br>
                示例2：段A(3次)+过渡步骤=B(填报警名)+验证步骤=C → B出现触发报警，C出现清空A计数。
            </div>
        </details>
    </div>
</script>
