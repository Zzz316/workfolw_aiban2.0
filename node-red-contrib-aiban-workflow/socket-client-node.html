<script type="text/javascript">
    // ===== 共享：浏览 Node-RED 服务器主机上的 YAML 文件（全局只定义一次） =====
    // 用法：aibanBrowseServerYaml(function(data){ /* data = {groupCameraMap, modelMap, ...} */ });
    if (!window.aibanBrowseServerYaml) {
        window.aibanBrowseServerYaml = function(onParsed) {
            var $mask = $('<div>').css({
                position: 'fixed', left: 0, top: 0, right: 0, bottom: 0,
                background: 'rgba(0,0,0,0.4)', zIndex: 5000
            }).appendTo('body');

            var $panel = $('<div>').css({
                position: 'fixed', left: '50%', top: '50%', transform: 'translate(-50%,-50%)',
                width: '520px', maxWidth: '90%', background: '#fff', border: '1px solid #ccc',
                borderRadius: '6px', padding: '16px', zIndex: 5001, boxShadow: '0 4px 16px rgba(0,0,0,0.3)'
            }).appendTo('body');

            $panel.append('<div style="font-weight:bold;margin-bottom:6px;">选择服务器上的 YAML 文件</div>');
            var $hint = $('<div>').css({fontSize:'12px', color:'#3a7', marginBottom:'6px'}).appendTo($panel);
            var $cur = $('<div>').css({
                fontSize:'13px', color:'#333', wordBreak:'break-all', marginBottom:'8px', fontWeight:'bold'
            }).appendTo($panel);
            var $list = $('<select size="10">').css({
                width:'100%', fontFamily:'monospace', fontSize:'14px', border:'1px solid #ddd', padding:'5px'
            }).appendTo($panel);
            $('<div style="margin-top:5px;font-size:12px;color:#888;">💡 双击文件夹进入下一级 / 双击 YAML 文件即可加载</div>').appendTo($panel);

            var $btns = $('<div>').css({marginTop:'12px', textAlign:'right'}).appendTo($panel);
            var $cancel = $('<button class="red-ui-button" style="background:#fff;color:#333;border:1px solid #ccc;">取消</button>').appendTo($btns);

            function close() { $mask.remove(); $panel.remove(); }
            $mask.click(close);
            $cancel.click(function(e){ e.preventDefault(); close(); });

            function loadDir(targetPath) {
                $.getJSON('/aiban/browse-yaml', { path: targetPath || '' }, function(data) {
                    $cur.text(data.current);
                    if (data.hostname) $hint.text('Node-RED 主机: ' + data.hostname);
                    $list.empty();
                    if (data.current !== data.parent) {
                        $('<option>').attr('data-type','dir').val(data.parent).text('📁 .. (返回上一级)').appendTo($list);
                    }
                    (data.dirs || []).forEach(function(d) {
                        var p = data.current.replace(/\/$/, '') + '/' + d;
                        $('<option>').attr('data-type','dir').val(p).text('📁 ' + d).appendTo($list);
                    });
                    (data.files || []).forEach(function(f) {
                        var p = data.current.replace(/\/$/, '') + '/' + f;
                        $('<option>').attr('data-type','file').val(p).text('📄 ' + f).appendTo($list);
                    });
                }).fail(function() {
                    RED.notify("无法读取该目录，可能无权限或路径不存在", "error");
                });
            }

            $list.dblclick(function() {
                var $opt = $list.find('option:selected');
                if (!$opt.length) return;
                var p = $opt.val();
                if ($opt.attr('data-type') === 'dir') {
                    loadDir(p);
                } else {
                    $.ajax({
                        url: '/aiban/parse-server-yaml', type: 'POST', contentType: 'application/json',
                        data: JSON.stringify({ path: p }),
                        success: function(data) {
                            close();
                            RED.notify("全局配置加载成功！", "success");
                            if (typeof onParsed === 'function') onParsed(data);
                        },
                        error: function(xhr) {
                            var msg = (xhr.responseJSON && xhr.responseJSON.error) || "加载失败";
                            RED.notify("解析失败: " + msg, "error");
                        }
                    });
                }
            });

            loadDir('');
        };
    }

    RED.nodes.registerType('workflow-socket-client', {
        category: 'Aiban 引擎',
        color: '#A6E22E',
        defaults: {
            name: { value: "扬声器配置" },
            groupId: { value: "" },
            sourceId: { value: "" },
            host: { value: "" },
            port: { value: 2000 },
            encoding: { value: "" },
            
            // Speak ON 的配置 (二选一)
            speakOnType: { value: "hex" },
            speakOnPayload: { value: "000500070000400301E4E4" },
            
            // Speak OFF 的配置 (开关 + 二选一)
            enableSpeakOff: { value: true }, // 新增：是否启用 Speak OFF
            speakOffType: { value: "tts" },
            speakOffPayload: { value: "AT+TTS1=1,0,1,1,50\\r\\n[m3][s5][t5][v5]请注意..." },

            _groupCameraMap: { value: {} }
        },
        inputs: 1, outputs: 1, icon: "font-awesome/fa-volume-up",
        paletteLabel: "socket - client",
        label: function() { return this.name || "扬声器配置"; },
        oneditprepare: function() {
            var node = this;

            function updateDropdowns() {
                $('#node-input-groupId').empty().append('<option value="">选择群组</option>');
                if (node._groupCameraMap) {
                    Object.keys(node._groupCameraMap).forEach(gid => $('#node-input-groupId').append($('<option>', {value:gid, text:"Group "+gid})));
                }
                $('#node-input-groupId').val(node.groupId);
                updateSources();
            }

            function updateSources() {
                var gid = $('#node-input-groupId').val();
                $('#node-input-sourceId').empty().append('<option value="">选择摄像头ID</option>');
                if (gid && node._groupCameraMap && node._groupCameraMap[gid]) {
                    node._groupCameraMap[gid].forEach(cid => $('#node-input-sourceId').append($('<option>', {value:cid, text:"Camera "+cid})));
                }
                $('#node-input-sourceId').val(node.sourceId);
            }

            $('#node-input-groupId').change(updateSources);

            // 纯读取模式：只拉取全局 YAML 缓存
            $.getJSON("/aiban/global-yaml", function(data) {
                if (data && Object.keys(data.groupCameraMap).length > 0) {
                    node._groupCameraMap = data.groupCameraMap;
                    updateDropdowns();
                }
            });

            updateDropdowns();

            // --- 新增：控制 Speak OFF 面板的显示与隐藏 ---
            $('#node-input-enableSpeakOff').change(function() {
                if ($(this).is(':checked')) {
                    $('#speak-off-panel').slideDown();
                } else {
                    $('#speak-off-panel').slideUp();
                }
            });
            // 初始化面板状态
            if (node.enableSpeakOff) {
                $('#speak-off-panel').show();
            } else {
                $('#speak-off-panel').hide();
            }

            // ── 手动触发测试按钮 ──────────────────────────────
            function doSpeakerTest(speakType) {
                var sourceId = $('#node-input-sourceId').val();
                var groupId = $('#node-input-groupId').val();
                if (!sourceId || sourceId === '') {
                    RED.notify("⚠️ 请先选择摄像头 ID", "warning");
                    return;
                }
                var $result = $('#aiban-speaker-test-result');
                $result.show().css({color:'#2980b9',background:'#eaf2f8',padding:'8px',borderRadius:'4px'})
                       .html('<i class="fa fa-spinner fa-spin"></i> 正在发送测试指令...');

                $.ajax({
                    url: '/aiban/speaker/test',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        sourceid: parseInt(sourceId),
                        group_id: parseInt(groupId) || 1,
                        speak_type: speakType
                    }),
                    success: function(data) {
                        if (data.status === '200') {
                            $result.css({color:'#27ae60',background:'#e8f8f0'})
                                   .html('<i class="fa fa-check-circle"></i> ✅ 测试指令已发送！sourceid='
                                         + data.data.sourceid + ' speak=' + data.data.speak_type
                                         + '<br><small>请检查 vido_main.log 查看播报记录</small>');
                            RED.notify("✅ 喇叭测试指令已发送 (sourceid=" + data.data.sourceid + " speak=" + data.data.speak_type + ")", "success");
                        } else {
                            $result.css({color:'#e74c3c',background:'#fdecea'})
                                   .html('<i class="fa fa-times-circle"></i> ❌ 发送失败: ' + (data.errmsg || '未知错误'));
                            RED.notify("❌ 喇叭测试失败: " + (data.errmsg || '未知错误'), "error");
                        }
                    },
                    error: function(xhr, status, err) {
                        var msg = '网络错误';
                        try {
                            var r = JSON.parse(xhr.responseText);
                            msg = r.errmsg || msg;
                        } catch(e) {}
                        $result.css({color:'#e74c3c',background:'#fdecea'})
                               .html('<i class="fa fa-times-circle"></i> ❌ 请求失败: ' + msg);
                        RED.notify("❌ 无法连接 AiBan 服务: " + msg, "error");
                    }
                });
            }

            $('#aiban-speaker-test-on').click(function(e) {
                e.preventDefault();
                doSpeakerTest('on');
            });
            $('#aiban-speaker-test-off').click(function(e) {
                e.preventDefault();
                doSpeakerTest('off');
            });
        }
    });
</script>

<script type="text/html" data-template-name="workflow-socket-client">
    <div class="form-row" style="margin-bottom: 15px;">
        <div style="font-size: 12px; color: #666; background: #eef4fb; padding: 10px; border-radius: 4px; border: 1px dashed #b1cce8; line-height: 1.5;">
            <b>💡 数据源提示：</b>本节点下拉列表读取自全局环境。请先在 <b>Sequence / Timer / State</b> 任意一个节点中上传 YAML。
        </div>
    </div>
    <div class="form-row"><label>节点名称</label><input type="text" id="node-input-name" placeholder="例如: 动火摄像头01扬声器"></div>
    <div class="form-row"><label>群组 / 摄像头</label>
        <select id="node-input-groupId" style="width:30%"></select> 
        <select id="node-input-sourceId" style="width:38%"></select>
    </div>
    <hr>
    <h4><i class="fa fa-wifi"></i> 目标网络配置</h4>
    <div class="form-row"><label>目标 IP</label><input type="text" id="node-input-host"></div>
    <div class="form-row"><label>目标端口</label><input type="number" id="node-input-port" placeholder="2000"></div>
    <div class="form-row"><label>覆盖编码</label>
        <select id="node-input-encoding" style="width:70%">
            <option value="">(默认继承 Server 配置)</option>
            <option value="gbk">GBK</option>
            <option value="utf-8">UTF-8</option>
        </select>
    </div>
    <hr>
    <h4><i class="fa fa-bullhorn"></i> 报警指令配置</h4>
    
    <div class="form-row">
        <label style="width: 100%; font-weight: bold; color: red;">Speak ON (报警触发时)</label>
        <div style="display: flex; gap: 5px; align-items: flex-start;">
            <select id="node-input-speakOnType" style="width: 80px;">
                <option value="hex">HEX</option>
                <option value="tts">TTS</option>
            </select>
            <textarea id="node-input-speakOnPayload" rows="2" style="flex-grow: 1; font-family: monospace;" placeholder="输入指令或文本..."></textarea>
        </div>
    </div>
    
    <div class="form-row" style="margin-top: 15px;">
        <label style="width: auto; font-weight: bold; color: green;"><i class="fa fa-power-off"></i> 启用 Speak OFF (报警解除时)</label>
        <input type="checkbox" id="node-input-enableSpeakOff" style="display:inline-block; width:auto; vertical-align:top; margin-left: 10px;">
    </div>
    
    <div id="speak-off-panel" style="display: none; padding: 10px; background: #f9f9f9; border: 1px dashed #ccc; border-radius: 4px; margin-bottom: 12px;">
        <div class="form-row" style="margin-bottom: 0;">
            <div style="display: flex; gap: 5px; align-items: flex-start;">
                <select id="node-input-speakOffType" style="width: 80px;">
                    <option value="hex">HEX</option>
                    <option value="tts">TTS</option>
                </select>
                <textarea id="node-input-speakOffPayload" rows="3" style="flex-grow: 1; font-family: monospace;" placeholder="输入指令或文本..."></textarea>
            </div>
        </div>
    </div>
    <hr>
    <div class="form-row" style="margin-top: 10px;">
        <label style="width:100%; font-weight:bold;"><i class="fa fa-bolt"></i> 手动触发测试</label>
        <div style="display:flex; gap:8px; align-items:center; margin-top:4px;">
            <button id="aiban-speaker-test-on" class="red-ui-button" style="background:#e67e22;color:#fff;border:none;flex:1;">
                <i class="fa fa-volume-up"></i> 测试播报 (Speak ON)
            </button>
            <button id="aiban-speaker-test-off" class="red-ui-button" style="background:#95a5a6;color:#fff;border:none;flex:1;">
                <i class="fa fa-volume-off"></i> 测试关闭 (Speak OFF)
            </button>
        </div>
        <div id="aiban-speaker-test-result" style="margin-top:6px;font-size:12px;display:none;"></div>
    </div>
</script>
