<script type="text/html" data-help-name="aiban-result">
    <h3>aiban-result — 拓扑驱动结果判定</h3>
    <p>放置在 aiban-label 链的末端，自动从画布连线发现标签拓扑，
    管理多帧顺序识别的状态机，并输出终端事件 (OK/NG/TIMEOUT/INTERRUPTED)。</p>

    <h4>拓扑发现</h4>
    <p>部署时，此节点会从输入端口沿连线向上游追溯所有 <b>aiban-label</b> 节点，
    构建有序执行计划：</p>
    <pre>[aiban-runtime] → [标签 A] → [标签 B] → [标签 C] → <b>[result]</b></pre>
    <p>编译拓扑: <b>A → B → C</b> (3 个标签，动态生成状态 WAIT_B, WAIT_C)</p>

    <h4>状态机</h4>
    <ul>
        <li><b>IDLE</b>: 等待第一个标签 (A)</li>
        <li><b>WAIT_B</b>: A 已匹配，等待 B</li>
        <li><b>WAIT_C</b>: A→B 已匹配，等待 C</li>
        <li>全部匹配 → <b>OK</b></li>
        <li>乱序/跳步 → <b>NG</b></li>
        <li>超时 → <b>TIMEOUT</b></li>
    </ul>
    <p>状态按 (workflow_id + session_id + group_id + source_id) 隔离。</p>

    <h4>输出</h4>
    <p><b>simple-sequence</b> 模式仅输出终端事件 (OK/NG/TIMEOUT/INTERRUPTED)，
    包含兼容字段 <code>msg.abc_result</code>，并在 <code>msg.workflow.outcome</code>
    与 <code>msg.workflow.result</code> 中携带标准结果契约。
    过渡事件通过 WorkflowAuditLogger 异步记录到审计日志。</p>
    <p><b>outcome</b> 模式直接接收上游 <code>msg.workflow.outcome</code>，不反向解析拓扑，
    只负责校验、生成 <code>result_event_id</code>、终态去重、按需截图和统一输出。</p>

    <h4>配置</h4>
    <ul>
        <li><b>模式</b>: simple-sequence 保持旧低配置用法；outcome 用于复杂逻辑节点直接提交终态。</li>
        <li><b>Workflow ID</b>: 流程标识符，用于状态隔离。</li>
        <li><b>Scene ID</b>: 场景标识符，后续接入 Scene Registry 时由场景配置提供。</li>
        <li><b>周期超时</b>: 从匹配第一个标签开始的超时时间 (毫秒)。</li>
        <li><b>同帧重启</b>: 是否允许完成周期后立即使用同帧数据启动新周期。</li>
        <li><b>状态数据库路径</b>: SQLite 数据库路径 (相对于 userDir)。</li>
        <li><b>审计日志目录</b>: 审计日志输出目录。</li>
    </ul>

    <h4>手动重置</h4>
    <p>发送 <code>msg.topic === "aiban-reset"</code> 的消息来手动重置指定 source 的状态：</p>
    <pre>msg.payload = {
  workflow_id: "abc-demo",
  session_id: "sess1",
  group_id: 1,
  source_id: 1,
  reason: "手动干预",
  operator: "admin"
}</pre>
</script>
