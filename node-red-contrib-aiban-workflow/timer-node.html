<script type="text/javascript">
    RED.nodes.registerType('workflow-timer', {
        category: 'Aiban 引擎', color: '#87CEFA',
        defaults: {
            name: { value: "工时统计" }, groupId: { value: "" }, modelId: { value: "" },
            startLabel: { value: "" }, startConf: { value: 0.8 }, startModelId: { value: "" },
            endLabel: { value: "" }, endConf: { value: 0.8 }, endModelId: { value: "" },
            dbTable: { value: "work_hours" },
            useSubStart: { value: false }, startSubModels: { value: [] },
            useSubEnd: { value: false }, endSubModels: { value: [] },
            enableAbsence: { value: false }, absencePersonLabel: { value: "person" }, absenceConf: { value: 0.5 },
            saveAlarmResult: { value: false }, alarmResultTable: { value: "icamera_data.icam_alarm_data" }, alarmResultName: { value: "流程OK" },
            _groupCameraMap: { value: {} }, _modelMap: { value: {} }, _groupInferMap: { value: {} }
        },
        inputs: 1, outputs: 1, icon: "font-awesome/fa-clock-o",
        paletteLabel: "timer",
        label: function() { return this.name || "工时统计"; },
        oneditprepare: function() {
            var node = this;

            // ── 工具：子模型 / 子标签下拉 ──
            function buildSubModelOptions(selectElem, savedVal) {
                selectElem.empty().append('<option value="">选择模型</option>');
                if (node._modelMap) {
                    Object.keys(node._modelMap).forEach(function(mid) {
                        selectElem.append($('<option>', { value: mid, text: mid + " (" + node._modelMap[mid].modelName + ")" }));
                    });
                }
                if (savedVal !== undefined && savedVal !== null && savedVal !== "") selectElem.val(String(savedVal));
            }

            function buildSubLabelOptions(selectElem, subId, savedVal) {
                selectElem.empty().append('<option value="">请选择</option>');
                if (subId && node._modelMap && node._modelMap[subId] && node._modelMap[subId].labels) {
                    node._modelMap[subId].labels.forEach(function(lbl) {
                        var val = typeof lbl === 'object' ? (lbl.name || lbl.labelName) : lbl;
                        if (val) selectElem.append($('<option>', { value: val, text: val }));
                    });
                }
                if (savedVal) selectElem.val(savedVal);
            }

            function addSubRow(listContainer, data) {
                data = data || { model_id: "", label: "", confidence: 0.5 };
                var row = $('<div/>', { class: "sub-model-row", style: "display:flex; gap:6px; align-items:center; margin-top:4px;" }).appendTo(listContainer);

                row.append('<span style="font-size:12px; color:#333; white-space:nowrap;">模型:</span>');
                var midSel = $('<select/>', { class: "sub-mid", style: "flex:1; min-width:90px;" }).appendTo(row);

                row.append('<span style="font-size:12px; color:#333; white-space:nowrap;">标签:</span>');
                var lblSel = $('<select/>', { class: "sub-lbl", style: "flex:1; min-width:80px;" }).appendTo(row);

                row.append('<span style="font-size:12px; color:#333; white-space:nowrap;">置信度≥</span>');
                $('<input/>', { class: "sub-conf", type: "number", step: "0.1", style: "width:55px; flex-shrink:0;" }).val(data.confidence || 0.5).appendTo(row);

                $('<button/>', { type: "button", class: "red-ui-button", style: "flex-shrink:0;", title: "删除此子模型" })
                    .append('<i class="fa fa-times"></i>')
                    .click(function() { row.remove(); })
                    .appendTo(row);

                buildSubModelOptions(midSel, data.model_id);
                buildSubLabelOptions(lblSel, data.model_id, data.label);
                midSel.change(function() { buildSubLabelOptions(lblSel, $(this).val(), ""); });
            }

            // ── 从已存 sub_models 数组初始化列表 ──
            function loadSubModels(containerSelector, subModels) {
                var listEl = $(containerSelector);
                listEl.empty();
                if (!Array.isArray(subModels)) return;
                subModels.forEach(function(sm) {
                    var mid = sm.model_id;
                    (sm.labels || []).forEach(function(lbl) {
                        addSubRow(listEl, { model_id: mid, label: lbl.name || "", confidence: lbl.confidence || 0.5 });
                    });
                    if (!sm.labels || sm.labels.length === 0) {
                        addSubRow(listEl, { model_id: mid, label: "", confidence: 0.5 });
                    }
                });
            }

            // ── 旧格式 (subStartId/subStartName) 兼容 ──
            function legacyToSubModels(midRaw, name, conf) {
                var mid = parseInt(midRaw);
                if (isNaN(mid) || !name) return [];
                return [{ model_id: mid, labels: [{ name: name, confidence: parseFloat(conf) || 0.5 }] }];
            }

            $('#node-input-startLabel').data('saved-val', node.startLabel);
            $('#node-input-endLabel').data('saved-val', node.endLabel);
            $('#node-input-startModelId').data('saved-val', node.startModelId);
            $('#node-input-endModelId').data('saved-val', node.endModelId);

            // 旧字段迁移：subStartId/subStartName/subStartConf → startSubModels
            if ((!Array.isArray(node.startSubModels) || node.startSubModels.length === 0) && node.subStartId && node.subStartName) {
                node.startSubModels = [{
                    model_id: parseInt(node.subStartId),
                    labels: [{ name: node.subStartName, confidence: parseFloat(node.subStartConf) || 0.8 }]
                }];
            }
            if ((!Array.isArray(node.endSubModels) || node.endSubModels.length === 0) && node.subEndId && node.subEndName) {
                node.endSubModels = [{
                    model_id: parseInt(node.subEndId),
                    labels: [{ name: node.subEndName, confidence: parseFloat(node.subEndConf) || 0.8 }]
                }];
            }

            function populateLabels(forSel, ovrModelSel) {
                // forSel: jQuery 单元素 select，ovrModelSel: 对应的 model 覆盖下拉
                var effectiveMid = ovrModelSel.val() || $('#node-input-modelId').val();
                forSel.empty().append('<option value="">选择标签</option>');
                if (effectiveMid && node._modelMap && node._modelMap[effectiveMid] && node._modelMap[effectiveMid].labels) {
                    node._modelMap[effectiveMid].labels.forEach(function(lbl) {
                        var val = typeof lbl === 'object' ? (lbl.name || lbl.labelName) : lbl;
                        if (val) forSel.append($('<option>', { value: val, text: val }));
                    });
                }
                var savedVal = forSel.data('saved-val');
                if (savedVal) forSel.val(savedVal);
                setTimeout(function() { forSel.trigger('change'); }, 50);
            }

            function populateModelOverride(selectElem) {
                selectElem.empty().append('<option value="">[全局默认]</option>');
                if (node._modelMap) Object.keys(node._modelMap).forEach(function(mid) {
                    selectElem.append($('<option>', { value: mid, text: "M" + mid + ":" + node._modelMap[mid].modelName }));
                });
                var savedVal = selectElem.data('saved-val');
                if (savedVal) selectElem.val(savedVal);
            }

            function updateDropdowns() {
                $('#node-input-groupId').empty().append('<option value="">选择群组</option>');
                if (node._groupCameraMap) Object.keys(node._groupCameraMap).forEach(gid => $('#node-input-groupId').append($('<option>', { value: gid, text: "Group " + gid })));
                $('#node-input-groupId').val(node.groupId);

                $('#node-input-modelId').empty().append('<option value="">选择模型</option>');
                if (node._modelMap) Object.keys(node._modelMap).forEach(mid => $('#node-input-modelId').append($('<option>', { value: mid, text: node._modelMap[mid].modelName + "(ID:" + mid + ")" })));
                $('#node-input-modelId').val(node.modelId);

                populateModelOverride($('#node-input-startModelId'));
                populateModelOverride($('#node-input-endModelId'));
                populateLabels($('#node-input-startLabel'), $('#node-input-startModelId'));
                populateLabels($('#node-input-endLabel'), $('#node-input-endModelId'));
            }

            $('#node-input-groupId').change(updateDropdowns);
            $('#node-input-modelId').change(function() {
                $('#node-input-startLabel').data('saved-val', '');
                $('#node-input-endLabel').data('saved-val', '');
                populateLabels($('#node-input-startLabel'), $('#node-input-startModelId'));
                populateLabels($('#node-input-endLabel'), $('#node-input-endModelId'));
            });
            $('#node-input-startModelId').change(function() {
                $('#node-input-startLabel').data('saved-val', '');
                populateLabels($('#node-input-startLabel'), $(this));
            });
            $('#node-input-endModelId').change(function() {
                $('#node-input-endLabel').data('saved-val', '');
                populateLabels($('#node-input-endLabel'), $(this));
            });

            // 标签变更时自动联动二阶（如果当前列表为空）
            function autoLinkSub(labelVal, effectiveMid, gid, listSelector, useCheckSelector) {
                if (!effectiveMid || !node._modelMap[effectiveMid] || !gid || !node._groupInferMap || !node._groupInferMap[gid]) return;
                var labelObj = node._modelMap[effectiveMid].labels.find(l => (typeof l === 'object' ? (l.name || l.labelName) : l) === labelVal);
                if (!labelObj || typeof labelObj !== 'object' || labelObj.sign === undefined) return;
                var mappedId = node._groupInferMap[gid][String(labelObj.sign)];
                if (mappedId === undefined) return;
                var listEl = $(listSelector);
                if (listEl.children().length > 0) return;
                $(useCheckSelector).prop('checked', true).trigger('change');
                addSubRow(listEl, { model_id: mappedId, label: "", confidence: 0.5 });
            }

            $('#node-input-startLabel').change(function() {
                var effectiveMid = $('#node-input-startModelId').val() || $('#node-input-modelId').val();
                autoLinkSub($(this).val(), effectiveMid, $('#node-input-groupId').val(),
                    '#start-sub-list', '#node-input-useSubStart');
            });
            $('#node-input-endLabel').change(function() {
                var effectiveMid = $('#node-input-endModelId').val() || $('#node-input-modelId').val();
                autoLinkSub($(this).val(), effectiveMid, $('#node-input-groupId').val(),
                    '#end-sub-list', '#node-input-useSubEnd');
            });

            $('#node-input-useSubStart').change(function() { if ($(this).is(':checked')) $('#sub-start-panel').css('display', 'flex'); else $('#sub-start-panel').hide(); });
            $('#node-input-useSubEnd').change(function() { if ($(this).is(':checked')) $('#sub-end-panel').css('display', 'flex'); else $('#sub-end-panel').hide(); });
            $('#node-input-enableAbsence').change(function() { if ($(this).is(':checked')) $('#absence-panel').slideDown(); else $('#absence-panel').slideUp(); });
            $('#node-input-saveAlarmResult').change(function() { if ($(this).is(':checked')) $('#alarm-result-panel').slideDown(); else $('#alarm-result-panel').slideUp(); });

            $('#start-add-sub').click(function() { addSubRow($('#start-sub-list'), null); });
            $('#end-add-sub').click(function() { addSubRow($('#end-sub-list'), null); });

            $.getJSON("/aiban/global-yaml", function(data) {
                if (data && Object.keys(data.groupCameraMap || {}).length > 0) {
                    node._groupCameraMap = data.groupCameraMap; node._modelMap = data.modelMap; node._groupInferMap = data.groupInferMap; updateDropdowns();
                    loadSubModels('#start-sub-list', node.startSubModels);
                    loadSubModels('#end-sub-list', node.endSubModels);
                }
            });

            $('#btn-upload').click(function(e) {
                e.preventDefault();
                aibanBrowseServerYaml(function(data) {
                    node._groupCameraMap = data.groupCameraMap; node._modelMap = data.modelMap; node._groupInferMap = data.groupInferMap;
                    updateDropdowns();
                    loadSubModels('#start-sub-list', node.startSubModels);
                    loadSubModels('#end-sub-list', node.endSubModels);
                });
            });

            updateDropdowns();
            loadSubModels('#start-sub-list', node.startSubModels);
            loadSubModels('#end-sub-list', node.endSubModels);
            if (node.useSubStart) $('#sub-start-panel').css('display', 'flex');
            if (node.useSubEnd) $('#sub-end-panel').css('display', 'flex');
            if (node.enableAbsence) $('#absence-panel').show();
            if (node.saveAlarmResult) $('#alarm-result-panel').show();
        },
        oneditsave: function() {
            $('#node-input-startLabel').data('saved-val', $('#node-input-startLabel').val());
            $('#node-input-endLabel').data('saved-val', $('#node-input-endLabel').val());
            $('#node-input-startModelId').data('saved-val', $('#node-input-startModelId').val());
            $('#node-input-endModelId').data('saved-val', $('#node-input-endModelId').val());

            // 收集 start / end 各自的 sub_models 数组
            function collect(listSelector) {
                var grouped = {};
                $(listSelector).find('.sub-model-row').each(function() {
                    var rowEl = $(this);
                    var smid = parseInt(rowEl.find('.sub-mid').val());
                    var sname = rowEl.find('.sub-lbl').val();
                    var sconf = parseFloat(rowEl.find('.sub-conf').val()) || 0.5;
                    if (isNaN(smid) || !sname) return;
                    if (!grouped[smid]) grouped[smid] = { model_id: smid, labels: [] };
                    grouped[smid].labels.push({ name: sname, confidence: sconf });
                });
                return Object.values(grouped);
            }
            this.startSubModels = collect('#start-sub-list');
            this.endSubModels = collect('#end-sub-list');
        }
    });
</script>

<script type="text/html" data-template-name="workflow-timer">
    <div class="form-row"><button type="button" class="red-ui-button" id="btn-upload" style="width: 100%;"><i class="fa fa-folder-open"></i> 选择服务器 YAML (含二阶解析)</button></div>
    <div class="form-row"><label>节点名称</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label>群组</label><select id="node-input-groupId" style="width:70%"></select></div>
    <div class="form-row"><label>默认模型</label><select id="node-input-modelId" style="width:70%"></select></div>

    <hr>
    <h4><i class="fa fa-play-circle" style="color: green;"></i> 触发条件 (开始)</h4>
    <div class="form-row" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
        <label style="margin:0;">模型覆盖</label>
        <select id="node-input-startModelId" style="width:140px;" title="留空则用默认模型"></select>
        <label style="margin:0 0 0 8px;">触发标签</label>
        <select id="node-input-startLabel" style="width:120px;"></select>
        <span style="margin-left:6px;">置信度:</span>
        <input type="number" step="0.1" id="node-input-startConf" style="width:60px;">
        <label style="margin-left:10px; display:flex; align-items:center; color:#0066cc; font-weight:bold; cursor:pointer;">
            <input type="checkbox" id="node-input-useSubStart" style="margin:0 5px 0 0;"> 二阶子框
        </label>
    </div>
    <div id="sub-start-panel" class="form-row" style="display:none; flex-direction:column; gap:4px; padding:6px 10px; background:#eef4fb; border-radius:4px; border:1px dashed #b1cce8; width:100%; box-sizing:border-box;">
        <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:12px; color:#333;"><i class="fa fa-level-down"></i> 二阶子模型（同模型多行=OR，不同模型=AND）</span>
            <button type="button" class="red-ui-button red-ui-button-small" id="start-add-sub" style="margin-left:auto;"><i class="fa fa-plus"></i> 添加子模型</button>
        </div>
        <div id="start-sub-list" style="display:flex; flex-direction:column; gap:4px;"></div>
    </div>

    <hr>
    <h4><i class="fa fa-stop-circle" style="color: red;"></i> 结束条件 (存库)</h4>
    <div class="form-row" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
        <label style="margin:0;">模型覆盖</label>
        <select id="node-input-endModelId" style="width:140px;" title="留空则用默认模型"></select>
        <label style="margin:0 0 0 8px;">结束标签</label>
        <select id="node-input-endLabel" style="width:120px;"></select>
        <span style="margin-left:6px;">置信度:</span>
        <input type="number" step="0.1" id="node-input-endConf" style="width:60px;">
        <label style="margin-left:10px; display:flex; align-items:center; color:#0066cc; font-weight:bold; cursor:pointer;">
            <input type="checkbox" id="node-input-useSubEnd" style="margin:0 5px 0 0;"> 二阶子框
        </label>
    </div>
    <div id="sub-end-panel" class="form-row" style="display:none; flex-direction:column; gap:4px; padding:6px 10px; background:#eef4fb; border-radius:4px; border:1px dashed #b1cce8; width:100%; box-sizing:border-box;">
        <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:12px; color:#333;"><i class="fa fa-level-down"></i> 二阶子模型（同模型多行=OR，不同模型=AND）</span>
            <button type="button" class="red-ui-button red-ui-button-small" id="end-add-sub" style="margin-left:auto;"><i class="fa fa-plus"></i> 添加子模型</button>
        </div>
        <div id="end-sub-list" style="display:flex; flex-direction:column; gap:4px;"></div>
    </div>

    <div class="form-row" style="margin-top: 15px;"><label><i class="fa fa-database"></i> 存入表名</label><input type="text" id="node-input-dbTable" style="width:70%"></div>

    <hr>
    <div class="form-row"><label style="width: auto; font-weight: bold;"><i class="fa fa-check-circle"></i> 同时写入报警表</label><input type="checkbox" id="node-input-saveAlarmResult" style="display:inline-block; width:auto; vertical-align:top; margin-left: 10px;"></div>
    <div id="alarm-result-panel" style="display: none; padding: 10px; background: #eef8ef; border: 1px dashed #8bc58b; border-radius: 4px; margin-bottom: 12px;">
        <div class="form-row"><label>报警表名</label><input type="text" id="node-input-alarmResultTable" style="width:70%" placeholder="icamera_data.icam_alarm_data"></div>
        <div class="form-row" style="margin-bottom: 0;"><label>报警名称</label><input type="text" id="node-input-alarmResultName" style="width:70%" placeholder="需与 icam_alarmname_data.alarmname 对应，如：流程OK"></div>
    </div>

    <hr>
    <div class="form-row"><label style="width: auto; font-weight: bold;"><i class="fa fa-user-times"></i> 启用人员离岗追踪</label><input type="checkbox" id="node-input-enableAbsence" style="display:inline-block; width:auto; vertical-align:top; margin-left: 10px;"></div>
    <div id="absence-panel" style="display: none; padding: 10px; background: #fff3e0; border: 1px dashed #ffb74d; border-radius: 4px; margin-bottom: 12px;">
        <div class="form-row" style="margin-bottom: 0;"><label>人员标签名</label><input type="text" id="node-input-absencePersonLabel" style="width: 40%"> 置信度: <input type="number" step="0.1" id="node-input-absenceConf" style="width: 15%"></div>
    </div>
</script>
