<script type="text/javascript">
    RED.nodes.registerType('workflow-api-output', {
        category: 'Aiban 引擎',
        color: '#E6A23C',
        defaults: {
            name: { value: "API输出结果" },
            groupId: { value: "" },
            sourceId: { value: "" },
            appid: { value: "", required: true },
            appsecret: { value: "32f35d31e868f680240de2cf7894c18e" },
            url: { value: "http://127.0.0.1:6090/core/api/openapi/msg/send-channel-open", required: true },
            _groupCameraMap: { value: {} }
        },
        inputs: 1, outputs: 1, icon: "font-awesome/fa-cloud-upload",
        paletteLabel: "api output",
        label: function() { return this.name || "API输出结果"; },
        oneditprepare: function() {
            var node = this;

            function updateGroups() {
                $('#node-input-groupId').empty().append('<option value="">选择群组</option>');
                if (node._groupCameraMap) Object.keys(node._groupCameraMap).forEach(gid =>
                    $('#node-input-groupId').append($('<option>', { value: gid, text: "Group " + gid })));
                $('#node-input-groupId').val(node.groupId);
                updateSources();
            }

            function updateSources() {
                var gid = $('#node-input-groupId').val();
                $('#node-input-sourceId').empty().append('<option value="">(可选)绑定摄像头，留空对全 group 报警生效</option>');
                if (gid && node._groupCameraMap && node._groupCameraMap[gid]) {
                    node._groupCameraMap[gid].forEach(cid =>
                        $('#node-input-sourceId').append($('<option>', { value: cid, text: "Camera " + cid })));
                }
                $('#node-input-sourceId').val(node.sourceId);
            }

            $.getJSON("/aiban/global-yaml", function(data) {
                if (data && Object.keys(data.groupCameraMap || {}).length > 0) {
                    node._groupCameraMap = data.groupCameraMap;
                    updateGroups();
                }
            });
            updateGroups();
            $('#node-input-groupId').change(updateSources);

            $('#btn-send-test').click(function(e) {
                e.preventDefault();
                var $out = $('#test-result-output');
                $out.text('发送中...');
                var payload = {
                    url: $('#node-input-url').val(),
                    appid: $('#node-input-appid').val(),
                    appsecret: $('#node-input-appsecret').val(),
                    ngcode: $('#node-input-testNgcode').val() || '报警名称',
                    ngarea: $('#node-input-testNgarea').val() || '报警区域',
                    timeoutMs: 5000
                };
                $.ajax({
                    url: 'aiban/test-api-output',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(payload)
                }).done(function(data) {
                    $out.text('HTTP ' + data.statusCode + '\n' + (data.body || ''));
                }).fail(function(xhr) {
                    var msg = (xhr.responseJSON && xhr.responseJSON.error) || xhr.statusText || '请求失败';
                    $out.text('错误：' + msg);
                });
            });
        }
    });
</script>

<script type="text/html" data-template-name="workflow-api-output">
    <div class="form-row"><label>节点名称</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label>群组</label><select id="node-input-groupId" style="width:70%"></select></div>
    <div class="form-row"><label>绑定摄像头</label><select id="node-input-sourceId" style="width:70%"></select></div>
    <div style="font-size:12px;color:#666;margin-bottom:8px;">留空则该群组下任意摄像头报警时都推送；选定某摄像头则只在该摄像头报警时推送。</div>

    <hr><h4><i class="fa fa-globe"></i> API 接口</h4>
    <div class="form-row"><label>appid</label><input type="text" id="node-input-appid" placeholder="如 202502170000000001"></div>
    <div class="form-row"><label>appsecret</label><input type="text" id="node-input-appsecret"></div>
    <div class="form-row"><label>url</label><input type="text" id="node-input-url" placeholder="http://.../send-channel-open"></div>
    <div style="font-size:12px;color:#888;margin-left:104px;margin-bottom:8px;">默认 IP 为 <code>127.0.0.1</code>，请改成<b>中台服务器</b>对应的 IP。</div>

    <hr><h4><i class="fa fa-paper-plane"></i> 手动测试</h4>
    <div class="form-row"><label>测试 ngcode</label><input type="text" id="node-input-testNgcode" placeholder="报警名称"></div>
    <div class="form-row"><label>测试 ngarea</label><input type="text" id="node-input-testNgarea" placeholder="报警区域"></div>
    <div class="form-row"><label>&nbsp;</label><button type="button" class="red-ui-button" id="btn-send-test"><i class="fa fa-paper-plane"></i> 发送测试</button></div>
    <div class="form-row"><label>结果</label><pre id="test-result-output" style="width:70%; min-height:80px; max-height:200px; overflow:auto; background:#f4f4f4; border:1px solid #ddd; padding:6px; font-size:12px;"></pre></div>
</script>

<script type="text/html" data-help-name="workflow-api-output">
    <p>把报警结果通过 HTTP API 推送给外部系统（数据格式同 <code>api.py</code>）。作为报警的<b>附加输出</b>：每当工作流触发报警，引擎自动调用该 API，无需在流程里写动作。</p>
    <p>导出后由 exporter 写入 group_X.json 顶层 <code>api_outputs</code>，运行时由报警进程（core/alarm_db.py）在报警发生时调用。</p>
    <p><b>取值规则</b></p>
    <ul>
        <li><code>ngcode</code> = 报警内容（alarm_content）</li>
        <li><code>ngarea</code> = 报警区域（region）</li>
        <li>两者运行时自动填充，节点里只需配 appid / appsecret / url。</li>
    </ul>
    <p><b>绑定</b>：填了「绑定摄像头」则只对该 sourceid 的报警推送；留空则对该 group 所有摄像头报警推送。</p>
    <p><b>使用步骤</b></p>
    <ol>
        <li>配置群组、appid、url（appsecret 默认已填，可改）。</li>
        <li>把节点串到 exporter 之前的汇聚节点。</li>
        <li>用「发送测试」按钮验证 url/appid/appsecret 能正常调用。</li>
    </ol>
</script>
