<script type="text/javascript">
    RED.nodes.registerType("aiban-socket-output", {
        category: "AiBan Workflow",
        color: "#f9d6d2",
        defaults: {
            name: { value: "" },
            host: { value: "" },
            port: { value: "" },
            encoding: { value: "utf8" },
            speakOnPayload: { value: "speak_on" },
            speakOffPayload: { value: "speak_off" },
            timeoutMs: { value: 3000 }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-volume-up",
        label: function() { return this.name || "aiban socket output"; },
        paletteLabel: "socket output"
    });
</script>

<script type="text/html" data-template-name="aiban-socket-output">
    <div class="form-row"><label for="node-input-name">名称</label><input type="text" id="node-input-name"></div>

    <div class="form-row"><label for="node-input-port">Port</label><input type="number" id="node-input-port"></div>
    <div class="form-row"><label for="node-input-encoding">Encoding</label><input type="text" id="node-input-encoding"></div>
    <div class="form-row"><label for="node-input-speakOnPayload">Speak On</label><input type="text" id="node-input-speakOnPayload"></div>
    <div class="form-row"><label for="node-input-speakOffPayload">Speak Off</label><input type="text" id="node-input-speakOffPayload"></div>
</script>

<script type="text/html" data-help-name="aiban-socket-output">
    <p>Sends 2.0 outcome speaker/socket effects to a TCP endpoint.</p>
</script>
